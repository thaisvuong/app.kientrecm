<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiến Trẻ CM</title>
<meta name="description" content="Kiến Trẻ CM — thư viện tài liệu & lớp gia sư">
<meta name="theme-color" content="#1B2A6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiến Trẻ CM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #F1F5FB; overflow: hidden; }
  #app { position: fixed; left: 0; right: 0; top: 0; bottom: env(safe-area-inset-bottom); width: 100%; height: calc(100% - env(safe-area-inset-bottom)); border: 0; display: block; background: transparent; }
  /* khung xương đúng bố cục app — mở từ màn hình chính là thấy ngay hình dạng trang */
  #ld { position: fixed; inset: 0; display: flex; background: #F1F5FB; transition: opacity .3s; z-index: 2; }
  #ld.out { opacity: 0; pointer-events: none; }
  .k { display: block; border-radius: 8px; background: linear-gradient(90deg, #E3E9F3 25%, #F0F4FA 37%, #E3E9F3 63%); background-size: 400% 100%; animation: sh 1.3s ease infinite; }
  @keyframes sh { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  .k-l { height: 10px; } .k-l.t { height: 8px; margin: 0 0 6px; }
  .k-sb { width: 238px; flex-shrink: 0; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; background: #fff; border-right: 1px solid #E5EAF3; }
  .k-br { display: flex; gap: 10px; align-items: center; height: 40px; margin-bottom: 10px; } .k-br span { flex: 1; } .k-lg { width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; }
  .k-sec { height: 8px; width: 40%; margin: 12px 6px 2px; } .k-nv { height: 34px; border-radius: 999px; }
  .k-mn { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .k-tb { height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #fff; border-bottom: 1px solid #E5EAF3; } .k-tb span { width: 160px; }
  .k-sr { height: 34px; flex: 0 1 320px; margin-left: auto; border-radius: 999px; } .k-dt { width: 34px; height: 34px; border-radius: 50%; }
  .k-bd { padding: 16px; display: flex; flex-direction: column; gap: 14px; } .k-hero { height: 140px; border-radius: 20px; }
  .k-kp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; } .k-kp .k { height: 80px; border-radius: 16px; }
  .k-cd { background: #fff; border: 1px solid #E5EAF3; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; } .k-rw { height: 38px; border-radius: 10px; }
  @media (max-width: 900px) { .k-sb { display: none; } .k-sr { flex-basis: 40px; } .k-kp { grid-template-columns: repeat(2, 1fr); } .k-hero { height: 110px; } }
  #app { opacity: 0; transition: opacity .25s; } #app.on { opacity: 1; }

  #pushSheet { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10; max-width: 460px; margin: 0 auto; background: #fff; border-radius: 18px; box-shadow: 0 18px 50px rgba(15,23,42,.28); padding: 14px; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #0F172A; animation: up .25s ease; }
  #pushSheet .ps-b { display: flex; gap: 12px; align-items: center; } #pushSheet img { width: 44px; height: 44px; border-radius: 12px; }
  #pushSheet b { display: block; font-size: 15px; } #pushSheet span { display: block; font-size: 12.5px; color: #475569; margin-top: 2px; }
  #pushSheet .ps-a { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  #pushSheet button { height: 42px; border-radius: 12px; border: 1px solid #E2E8F0; background: #fff; font: 600 14px -apple-system, BlinkMacSystemFont, sans-serif; color: #334155; }
  #pushSheet #psOk { background: #1D4ED8; border-color: #1D4ED8; color: #fff; }
  @keyframes up { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div id="ld" aria-label="Đang mở Kiến Trẻ CM">
  <aside class="k-sb"><div class="k-br"><i class="k k-lg"></i><span><i class="k k-l" style="width:70%"></i><i class="k k-l t" style="width:45%"></i></span></div>
    <i class="k k-sec"></i><i class="k k-nv"></i><i class="k k-nv"></i><i class="k k-nv"></i><i class="k k-nv"></i><i class="k k-sec"></i><i class="k k-nv"></i><i class="k k-nv"></i></aside>
  <div class="k-mn"><div class="k-tb"><span><i class="k k-l t" style="width:40%"></i><i class="k k-l" style="width:65%"></i></span><i class="k k-sr"></i><i class="k k-dt"></i></div>
    <div class="k-bd"><i class="k k-hero"></i><div class="k-kp"><i class="k"></i><i class="k"></i><i class="k"></i><i class="k"></i></div>
      <div class="k-cd"><i class="k k-l" style="width:30%"></i><i class="k k-rw"></i><i class="k k-rw"></i><i class="k k-rw"></i></div></div></div>
</div>
<iframe id="app" title="Kiến Trẻ CM" allow="clipboard-read; clipboard-write; fullscreen; autoplay; encrypted-media; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
  // Trang vỏ: biểu tượng & tên app trên màn hình chính; app thật (Apps Script) chạy trong khung bên dưới.
  var APP = 'https://script.google.com/macros/s/AKfycbxKXWv9Jg4KnV2ydW9tXWEsZsJIy1Ai07aHrY-cqF1i0t-RYl7xEcjsv2HuNtLC_7c/exec';
  var q = new URLSearchParams(location.search); q.set('shell', '1');
  var f = document.getElementById('app'), ld = document.getElementById('ld');
  // giữ khung xương tới khi app báo "ready" (khung xương của app tiếp quản) — khỏi thấy màn trắng lúc Google đang tải
  var shown = false, show = function () { if (shown) return; shown = true; f.classList.add('on'); ld.classList.add('out'); };
  f.onload = function () { setTimeout(show, 6000); };
  setTimeout(show, 20000);
  f.src = APP + '?' + q.toString();
  // Giữ hộ mã đăng nhập: trình duyệt có thể xoá bộ nhớ của app nằm trong khung (nhất là iPhone),
  // nên app gửi mã sang đây để lưu ở bộ nhớ của trang này. Chỉ nhận / trả cho khung app của Google.
  var KEY = 'kgsToken', OK = /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/;
  // thông báo đẩy: service worker + quyền thông báo của máy nằm ở trang vỏ; app hỏi / bật / tắt qua postMessage
  var REG = ('serviceWorker' in navigator) ? navigator.serviceWorker.register('sw.js').catch(function () { return null; }) : Promise.resolve(null);
  var reply = function (e, m) { if (e.source) e.source.postMessage(m, e.origin); };
  var b64 = function (s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var r = atob(s), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; };
  var pushStatus = function () {
    var sup = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    var st = { kgs: 'push-status', supported: sup, standalone: matchMedia('(display-mode: standalone)').matches || navigator.standalone === true, perm: 'Notification' in window ? Notification.permission : 'unsupported', subscribed: false, ua: navigator.userAgent.slice(0, 120) };
    if (!sup) return Promise.resolve(st);
    return REG.then(function (reg) { return reg ? reg.pushManager.getSubscription() : null; }).then(function (s) { st.subscribed = !!s; return st; }).catch(function () { return st; });
  };
  var sheet = function (e, key) {
    var old = document.getElementById('pushSheet'); if (old) old.remove();
    var el = document.createElement('div'); el.id = 'pushSheet';
    el.innerHTML = '<div class="ps-b"><img src="icons/icon-192.png" alt=""><div><b>Bật thông báo Kiến Trẻ CM?</b><span>Nhận ngay khi yêu cầu được duyệt, được giao lớp, buổi học có nội dung…</span></div></div><div class="ps-a"><button id="psNo">Để sau</button><button id="psOk">Bật thông báo</button></div>';
    document.body.appendChild(el);
    el.querySelector('#psNo').onclick = function () { el.remove(); reply(e, { kgs: 'push-err', msg: 'Bạn đã chọn để sau' }); };
    el.querySelector('#psOk').onclick = function () {
      Notification.requestPermission().then(function (perm) {
        if (perm !== 'granted') throw new Error(perm === 'denied' ? 'Thông báo đang bị chặn trong cài đặt của máy' : 'Bạn chưa cho phép thông báo');
        return REG.then(function (reg) { if (!reg) throw new Error('Không khởi động được bộ nhận thông báo'); return navigator.serviceWorker.ready; });
      }).then(function (reg) { return reg.pushManager.getSubscription().then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(key) }); }); })
        .then(function (sub) { el.remove(); reply(e, { kgs: 'push-sub', sub: JSON.parse(JSON.stringify(sub)) }); })
        .catch(function (x) { el.remove(); reply(e, { kgs: 'push-err', msg: String(x && x.message || x) }); });
    };
  };
  if (navigator.clearAppBadge) document.addEventListener('visibilitychange', function () { if (!document.hidden) try { navigator.clearAppBadge(); } catch (x) {} });
  window.addEventListener('message', function (e) {
    if (!OK.test(e.origin) || !e.data || typeof e.data !== 'object') return;
    var d = e.data;
    if (d.kgs === 'ready') return void show();
    if (d.kgs === 'push-status' && d.supported === undefined) return void pushStatus().then(function (st) { reply(e, st); });
    if (d.kgs === 'push-enable' && typeof d.key === 'string') return void sheet(e, d.key);
    if (d.kgs === 'push-disable') return void REG.then(function (reg) { return reg && reg.pushManager.getSubscription(); }).then(function (s) { var ep = s && s.endpoint; return (s ? s.unsubscribe() : true).then(function () { reply(e, { kgs: 'push-off', endpoint: ep || '' }); }); }).catch(function () { reply(e, { kgs: 'push-off', endpoint: '' }); });
    if (d.kgs === 'get') { var t = ''; try { t = localStorage.getItem(KEY) || ''; } catch (x) {} if (e.source) e.source.postMessage({ kgs: 'token', token: t }, e.origin); }
    else if (d.kgs === 'set') { try { if (d.token && /^[\w-]{20,80}$/.test(d.token)) localStorage.setItem(KEY, d.token); else localStorage.removeItem(KEY); } catch (x) {} }
  });
</script>
</body>
</html>
