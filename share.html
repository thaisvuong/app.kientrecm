/* cài đặt Menu & tab */
.mn-g-card{ border:1px solid var(--border); border-radius:14px; margin-bottom:12px; background:var(--surface) }
.mn-gh{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--border); background:var(--surface-3); border-radius:14px 14px 0 0 }
.mn-gh > i{ color:#D99A16 } .mn-gh .sp{ flex:1 } .mn-gh small{ color:var(--muted); font-size:11px; white-space:nowrap }
.mn-gt{ max-width:240px; font-weight:800 }
.mn-list{ padding:6px; min-height:44px; display:flex; flex-direction:column; gap:4px; border-radius:0 0 14px 14px }
.mn-list.mn-over{ background:var(--brand-50) }
.mn-empty{ padding:10px; text-align:center; font-size:12px; color:var(--muted); border:1px dashed var(--border-strong); border-radius:10px }
.mn-i{ display:flex; align-items:center; gap:6px; padding:5px 6px; border-radius:10px; border:1px solid var(--border); background:var(--surface) }
.mn-i.off{ opacity:.55 } .mn-i.off input[data-t]{ text-decoration:line-through }
.mn-i.drag{ opacity:.35 } .mn-i.mn-over{ box-shadow:0 -3px 0 0 var(--brand-600) }
.mn-h{ cursor:grab; color:var(--muted); padding:0 2px }
.mn-ic i{ color:var(--brand-600); font-size:15px }
.mn-i input[data-t]{ flex:1 1 180px; min-width:0 } .mn-g{ flex:0 1 160px; min-width:0 }
.mn-cap{ flex:0 1 150px; min-width:0; font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.mn-lock{ width:34px; text-align:center; color:var(--muted) }
.inp.sm{ height:32px; padding:0 9px; font-size:12.5px }
.sw.sm{ transform:scale(.82); transform-origin:center }
.mn-icons{ display:grid !important; grid-template-columns:repeat(8, 34px); gap:4px; padding:8px !important; max-width:none !important }
.mn-icons button{ width:34px !important; height:34px; padding:0 !important; justify-content:center; border-radius:8px }
.mn-icons button i{ margin:0 !important; font-size:16px; color:var(--ink-2) } .mn-icons button.on{ background:var(--brand-50); box-shadow:inset 0 0 0 1px var(--brand-600) }
.mn-icons .mn-def{ grid-column:span 2; width:auto !important; font-size:11.5px; font-weight:700 }
@media (max-width:820px){ .mn-cap{ display:none } .mn-i{ flex-wrap:wrap } .mn-i input[data-t]{ flex-basis:120px } }

/* tạo link tạm nhanh */
.fc-ql{ position:absolute; left:8px; bottom:8px; z-index:2; width:30px; height:30px; border-radius:9px; border:0; display:grid; place-items:center; cursor:pointer; background:var(--brand-600); color:#fff; font-size:16px;
  box-shadow:0 4px 12px rgba(30,50,140,.3); opacity:0; transform:translateY(4px); transition:opacity var(--t-fast), transform var(--t-fast) }
.fcard:hover .fc-ql, .fc-ql:focus-visible{ opacity:1; transform:none }
@media (hover:none){ .fc-ql{ opacity:.92; transform:none } }
.fr-ql{ width:26px; height:26px; margin-left:6px; vertical-align:middle; color:var(--brand-600) }
.ql-list{ max-height:min(36vh,300px); overflow:auto; border:1px solid var(--border); border-radius:12px; padding:4px }
.ql-d{ display:flex; align-items:center; gap:6px; padding:6px 8px 2px; font-size:11.5px; font-weight:800; color:var(--ink-2) } .ql-d i{ color:#D99A16 }
.ql-f{ display:flex; align-items:center; gap:8px; padding:5px 8px 5px 20px; border-radius:8px; font-size:12.5px; cursor:pointer } .ql-f:hover{ background:var(--surface-3) }
.ql-f span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.ql-days{ display:flex; flex-wrap:wrap; gap:6px }
.ql-same{ border:1px solid var(--brand-100); background:var(--brand-50); border-radius:12px; padding:8px 10px; display:flex; flex-direction:column; gap:6px }
.ql-sr{ display:flex; align-items:center; gap:8px } .ql-sr > i{ color:var(--brand-600) } .ql-sr span{ flex:1; min-width:0; display:flex; flex-direction:column } .ql-sr small{ color:var(--muted); font-size:11px }
.ql-sr b{ font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.ql-done{ border:1px solid #86EFAC; background:#F0FDF4; border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px } .ql-done .row i{ color:#16A34A }

/* Theo dõi link tạm — dạng danh sách */
.lk-tbl td{ vertical-align:middle; white-space:nowrap } .lk-tbl tr.off td{ opacity:.6 } .lk-tbl th{ white-space:nowrap }
.lk-tbl td:last-child, .lk-tbl th:last-child{ position:sticky; right:0; background:var(--surface); box-shadow:-8px 0 10px -8px rgba(15,23,42,.18); z-index:1 }
.lk-tbl thead th:last-child{ z-index:3 }
.lk-tbl td small{ color:var(--muted); font-size:10.5px }
.lk-tn{ display:flex; align-items:center; gap:8px; min-width:200px; max-width:min(380px, 30vw) } .lk-tn i{ color:var(--brand-600) } .lk-tn b{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700 }
.lk-ta{ display:flex; align-items:center; gap:4px; justify-content:flex-end; white-space:nowrap }
.lk-th{ cursor:pointer; user-select:none } .lk-th:hover, .lk-th.on{ color:var(--brand-700) }
.lk-tbar #lkVw{ flex-shrink:0 }

/* cảnh báo chương trình sắp hết bài */
.cl-rw{ border:1px solid #FCD34D; background:#FFFBEB; border-radius:14px; overflow:hidden }
.cl-rw > summary{ list-style:none; display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; font-size:13px; color:#78350F }
.cl-rw > summary::-webkit-details-marker{ display:none } .cl-rw > summary > i:first-child{ font-size:16px; color:#D97706 } .cl-rw > summary span{ flex:1 }
.cl-rw > summary .cv{ transition:transform var(--t-fast) } .cl-rw[open] > summary .cv{ transform:rotate(180deg) }
.cl-rwb{ padding:0 12px 12px; display:flex; flex-direction:column; gap:8px }
.cl-rwp{ background:var(--surface); border:1px solid #FDE68A; border-radius:12px; padding:8px 10px }
.cl-rwh{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px } .cl-rwh small{ color:var(--muted) } .cl-rwh .sp{ flex:1 }
.cl-rwl{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px }
.cl-rwc{ display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2, var(--surface)); font-size:12px; cursor:pointer; color:var(--ink) }
.cl-rwc span{ color:var(--muted) } .cl-rwc em{ font-style:normal; font-weight:800; color:#B45309 } .cl-rwc.out em{ color:#DC2626 } .cl-rwc:hover{ border-color:#F59E0B }
.cl-rwtag{ display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px; border-radius:999px; font-size:11.5px; font-weight:700; background:var(--surface-3); color:var(--ink-2) }
.cl-rwtag.on{ background:#FEF3C7; color:#92400E; box-shadow:inset 0 0 0 1px #FCD34D }
.pr-t .cl-rwtag{ margin-top:4px; align-self:flex-start }

.lk-mb:disabled{ opacity:.45; cursor:not-allowed; background:var(--surface-3) }
.cs-perm{ border:1px solid var(--border); border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; gap:10px; background:var(--surface-2, var(--surface)) }
.cs-ph{ display:flex; align-items:center; gap:8px; font-size:13px } .cs-ph i{ color:var(--brand-600) }

/* Duyệt & phát: phần đầu (tab, lọc, tab trạng thái) đứng yên, chỉ danh sách cuộn */
.cl-view.cl-todo .cl-body{ overflow:hidden }
.ct-head{ display:flex; flex-direction:column; gap:10px; flex-shrink:0 }
.ct-scroll{ flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:10px; padding:2px 2px 16px; margin:0 -2px; overscroll-behavior:contain }
.ct-tabs{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px }
.ct-tabs::-webkit-scrollbar{ display:none }
.ct-tab{ display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:12px; font-weight:700; color:var(--ink-2); cursor:pointer; white-space:nowrap; flex-shrink:0; transition:var(--t-fast) }
.ct-tab:hover{ border-color:var(--brand-200, var(--brand-100)); color:var(--ink) }
.ct-tab em{ font-style:normal; min-width:20px; height:18px; padding:0 6px; border-radius:999px; background:var(--surface-3); font-size:10.5px; display:grid; place-items:center }
.ct-tab.on{ background:var(--brand-700); border-color:var(--brand-700); color:#fff } .ct-tab.on em{ background:rgba(255,255,255,.22); color:#fff }
.ct-tab.s-draft i{ color:#2563EB } .ct-tab.s-none i{ color:#DC2626 } .ct-tab.s-prev i{ color:#D97706 } .ct-tab.s-out i, .ct-tab.s-taught i{ color:#16A34A } .ct-tab.s-off i{ color:var(--muted) }
.ct-tab.on i{ color:#fff }
/* điện thoại: một hàng tìm + nút Lọc (mở bảng lọc) + Duyệt; tab trạng thái vuốt ngang; danh sách cuộn dưới phần đầu cố định */
.ct-fb, .ct-allm{ display:none } .ct-f{ display:contents }
.ct-fb em{ font-style:normal; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--brand-600); color:#fff; font-size:10.5px; display:grid; place-items:center }
@media (max-width:900px){
  .cl-view.cl-todo{ height:100%; overflow:hidden; padding:8px 10px 0 }
  .cl-view.cl-todo .cl-body{ overflow:hidden }
  .cl-view.cl-todo .cl-top{ flex-shrink:0 }
  .ct-head{ gap:8px }
  .ct-bar{ flex-wrap:wrap; gap:6px } .ct-bar .search{ flex:1 1 0; min-width:0 } .ct-bar .sp{ display:none }
  .ct-fb, .ct-allm{ display:inline-flex; flex-shrink:0 } .ct-alld{ display:none }
  .ct-f{ display:none } .ct-f.open{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; width:100%; padding:8px; border:1px solid var(--border); border-radius:12px; background:var(--surface) }
  .ct-f .sel{ width:100%; max-width:none; min-width:0 } .ct-f #ctClr{ grid-column:1 / -1; justify-content:center }
  .ct-tabs{ margin:0 -10px; padding:0 10px 2px; touch-action:pan-x; -webkit-overflow-scrolling:touch }
  .ct-tab{ height:30px; padding:0 10px; font-size:11.5px }
  .ct-scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(16px + var(--sab)) }
  .ct-hint{ display:none }
  .ct-scroll .cl-np{ font-size:12px } .ct-scroll .cl-sh small{ display:none }
}

/* Hoạt động */
.ac-tbl td, .ac-log td{ vertical-align:middle } .ac-sub{ display:block; font-size:10.5px; color:var(--muted); font-weight:400 }
.ac-u{ display:flex; align-items:center; gap:8px; min-width:180px } .ac-u span:last-child{ display:flex; flex-direction:column; min-width:0 } .ac-u small{ color:var(--muted); font-size:11px }
.ac-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#94A3B8; flex-shrink:0 }
.ac-st{ display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:12px; white-space:nowrap }
.ac-on .ac-st .ac-dot{ background:#22C55E; box-shadow:0 0 0 3px rgba(34,197,94,.18) } .ac-on .ac-st{ color:#15803D }
.ac-idle .ac-st .ac-dot{ background:#F59E0B } .ac-idle .ac-st{ color:#B45309 }

.ac-chat{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--brand-700); font-weight:600; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.ac-sync{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; white-space:nowrap }
.ac-sync.ok .ac-dot{ background:#22C55E } .ac-sync.ok{ color:var(--muted); font-weight:600 } .ac-sync.warn .ac-dot{ background:#F97316 } .ac-sync.warn{ color:#C2410C } .ac-sync.bad .ac-dot{ background:#EF4444 } .ac-sync.bad{ color:#B91C1C }
.ac-act{ font-size:12px; font-weight:600 } .ac-a{ display:flex; gap:4px; justify-content:flex-end; white-space:nowrap }
.ac-q{ width:240px } .card-h .sel{ width:auto }
@media (max-width:820px){ .ac-q{ width:100% } .card-h{ flex-wrap:wrap } }
.ce-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px } .ce-grid .wide{ grid-column:1 / -1 }
@media (max-width:620px){ .ce-grid{ grid-template-columns:minmax(0,1fr) } }

/* chọn nhiều link tạm */
.lk-bulk{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:42px; padding:6px 12px; border-radius:12px; border:1px dashed var(--border-strong); font-size:12.5px }
.lk-bulk.on{ border-style:solid; border-color:var(--brand-600); background:var(--brand-50); position:sticky; top:0; z-index:4 } .lk-bulk .sp{ flex:1 }
.lk-sel{ display:inline-grid; place-items:center; width:22px; height:22px; flex-shrink:0; cursor:pointer } .lk-sel input{ width:16px; height:16px; cursor:pointer; accent-color:var(--brand-600) }
.lk-card .lk-cm .lk-sel{ align-self:flex-start; margin:8px -2px 0 -4px }
.lk-card.sel{ box-shadow:0 0 0 2px var(--brand-600) } .lk-tbl tr.sel td{ background:var(--brand-50) }
.lk-bdanger{ color:var(--danger) } .lk-bdel{ background:#DC2626 !important; border-color:#DC2626 !important; color:#fff !important }

/* ══════════ HƯỚNG DẪN SỬ DỤNG ══════════ */
.gd-lay{ display:grid; grid-template-columns:250px minmax(0,1fr); gap:var(--sp-3); align-items:start }
.gd-toc{ position:sticky; top:0; padding:10px; display:flex; flex-direction:column; gap:2px; max-height:calc(100dvh - 120px); overflow:auto }
.gd-th{ display:flex; align-items:center; gap:8px; padding:4px 6px 8px; font-size:13px } .gd-th i{ color:var(--brand-600) }
.gd-toc a{ display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:9px; font-size:12.5px; font-weight:600; color:var(--ink-2); cursor:pointer; text-decoration:none }
.gd-toc a:hover{ background:var(--surface-3) } .gd-toc a.on{ background:var(--brand-50); color:var(--brand-800) } .gd-toc a.dim{ opacity:.35 } .gd-toc a i{ color:var(--brand-600) }
.gd-n{ width:20px; height:20px; flex-shrink:0; border-radius:6px; display:grid; place-items:center; font:800 10.5px var(--font-mono); background:var(--surface-3); color:var(--ink-2) }
.gd-main{ display:flex; flex-direction:column; gap:var(--sp-3); min-width:0 }
.gd-hero{ display:flex; align-items:center; gap:16px; padding:20px 22px; background:linear-gradient(135deg, var(--brand-50), var(--surface)) }
.gd-hero h2{ font-size:18px; font-weight:800; margin-bottom:4px } .gd-hero p{ font-size:13.5px; color:var(--ink-2); line-height:1.55 } .gd-hero > i{ font-size:44px; color:var(--brand-600); margin-left:auto; opacity:.8 }
.gd-sec{ padding:18px 20px; scroll-margin-top:12px } .gd-sec[hidden]{ display:none }
.gd-sec h3{ display:flex; align-items:center; gap:8px; font-size:15px; font-weight:800; margin-bottom:12px } .gd-sec h3 .gd-n{ background:var(--brand-700); color:#fff } .gd-sec h3 i{ color:var(--brand-600) }
.gd-b{ display:flex; flex-direction:column; gap:12px; font-size:13.5px; line-height:1.6; color:var(--ink-2) } .gd-b a{ color:var(--brand-700); font-weight:700; cursor:pointer }
.gd-shot{ border:1px solid var(--border-strong); border-radius:14px; overflow:hidden; background:var(--bg, var(--surface-2)); box-shadow:var(--sh-1); max-width:860px }
.gd-bar{ display:flex; align-items:center; gap:6px; padding:7px 10px; background:var(--surface-3); border-bottom:1px solid var(--border); font-size:11px; font-weight:700; color:var(--muted) }
.gd-bar i{ width:9px; height:9px; border-radius:50%; background:#F87171 } .gd-bar i:nth-child(2){ background:#FBBF24 } .gd-bar i:nth-child(3){ background:#34D399 } .gd-bar span{ margin-left:6px }
.gd-in{ padding:14px; display:flex; flex-direction:column; gap:10px; pointer-events:none; user-select:none }
.gd-pin{ display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; background:#E11D48; color:#fff; font:800 11px var(--font-mono); box-shadow:0 0 0 3px rgba(225,29,72,.2); flex-shrink:0; margin:0 2px; vertical-align:middle }
.gd-steps{ margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:8px; counter-reset:none }
.gd-steps li{ display:flex; flex-direction:column; padding:8px 12px; border-left:3px solid var(--brand-600); background:var(--surface-2, var(--surface)); border-radius:0 10px 10px 0 }
.gd-steps li b{ color:var(--ink); font-size:13.5px } .gd-steps li span{ font-size:13px }
.gd-tip{ display:flex; gap:10px; padding:10px 12px; border-radius:12px; background:var(--brand-50); border:1px solid var(--brand-100); font-size:13px } .gd-tip > i{ color:var(--brand-600); font-size:16px }
.gd-tip.warn{ background:#FFFBEB; border-color:#FCD34D } .gd-tip.warn > i{ color:#D97706 }
.gd-login{ display:flex; flex-direction:column; gap:10px; max-width:340px; margin:0 auto; padding:16px; background:var(--surface); border-radius:16px; align-items:stretch }
.gd-login .login-logo{ width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg,var(--brand-700),var(--brand-500)); font-size:20px }
.gd-top, .gd-vt, .gd-sh, .gd-gh{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--surface); padding:8px 10px; border-radius:12px }
.gd-top .gd-tt{ display:flex; flex-direction:column; flex:1; min-width:120px } .gd-top small{ font-size:9.5px; font-weight:800; color:var(--muted); letter-spacing:.6px } .gd-top .tb-search{ position:static; width:220px }
.gd-dots{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px } .gd-dots span{ display:flex; gap:8px; align-items:baseline; padding:8px 10px; border-radius:10px; background:var(--surface-2, var(--surface)); border:1px solid var(--border); font-size:12.5px }
.gd-dots .sync .ob-dot{ background:#F97316 } .gd-dots .warn .ob-dot{ background:#EAB308 } .gd-dots .bad .ob-dot{ background:#EF4444 }
.gd-row{ margin:0 } .gd-row .cl-ra{ display:flex; align-items:center; gap:4px }
.gd-grid{ background:var(--surface); border-radius:12px; padding:8px; display:flex; flex-direction:column; gap:8px } .gd-gh{ padding:0 } .gd-gh .sp{ flex:1 } .gd-s{ display:flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid var(--border); border-radius:10px; font-size:12px; color:var(--muted); min-width:180px }
.gd-tbl{ width:100%; border-collapse:collapse; font-size:12.5px } .gd-tbl th{ text-align:left; font-size:10.5px; color:var(--muted); text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--border) } .gd-tbl td{ padding:8px; border-bottom:1px solid var(--border) } .gd-ed{ background:var(--brand-50) }
.gd-vt .grp{ display:flex; align-items:center; gap:4px } .gd-vt .sp, .gd-sh .sp{ flex:1 } .gd-vt .pg-in{ display:inline-grid; place-items:center; width:34px; height:28px; border:1px solid var(--border); border-radius:8px; font-size:12px }
.gd-page{ display:flex; gap:10px } .gd-paper{ flex:1; height:140px; background:#fff; border-radius:8px; box-shadow:var(--sh-1); padding:16px; display:flex; flex-direction:column; gap:10px } .gd-paper i{ height:8px; border-radius:4px; background:#E5E7EB } .gd-paper i:nth-child(1){ width:50%; background:#C7D2FE } .gd-paper i:nth-child(3){ width:80% }
.gd-side{ width:150px; background:var(--surface); border-radius:10px; padding:8px; display:flex; flex-direction:column; gap:4px; font-size:12px } .gd-side span{ display:flex; gap:6px; padding:5px 6px; border-radius:6px } .gd-side span.on{ background:var(--brand-50); color:var(--brand-800); font-weight:700 }
.gd-ql{ background:var(--surface); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; max-width:560px } .gd-inp{ display:flex; align-items:center }
.gd-pk{ display:flex; flex-direction:column; gap:6px; background:var(--surface); border-radius:12px; padding:10px; max-width:520px } .gd-pk .pk-r{ display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--border); border-radius:10px } .gd-pk .pk-r:not(.on){ opacity:.55 }
.gd-pk .pk-no{ width:22px; height:22px; border-radius:7px; display:grid; place-items:center; font:800 11px var(--font-mono); background:var(--brand-700); color:#fff } .gd-pk .pk-r:not(.on) .pk-no{ background:var(--surface-3); color:var(--muted) } .gd-pk .pk-t{ flex:1; display:flex; flex-direction:column; font-size:12.5px } .gd-pk .pk-t small{ color:var(--muted); font-size:11px }

/* ══════════════════════════════════════════════════════════════
   BẢN 1.2 — điện thoại kiểu Threads / Instagram: thanh tab dưới, bảng "Thêm", chi tiết lớp gọn, bảng tin Thông tin,

html{ touch-action:manipulation; -webkit-tap-highlight-color:transparent }

/* ══════════════════════════════════════════════════════════════
   BẢN 1.4 — nền trắng kiểu Threads / Instagram · bớt chữ chú thích · lọc bằng một nút phễu · sửa lớp tại chỗ (popup)
   · trao đổi theo lớp · Zalo khi rê chuột vào tên · thông báo dạng viên thuốc có Hoàn tác. Đặt cuối tệp để phủ luật cũ.
   ══════════════════════════════════════════════════════════════ */
/* (12-10-2026: bọc :where() để độ ưu tiên = 0 — khối “GIAO DIỆN 2” ở cuối tệp phủ lên được; phần nào khối mới không đụng thì vẫn theo đây)
   bộ màu MẶC ĐỊNH (Kiến Trẻ, không Liquid Glass) = trắng kiểu Threads / Instagram, có viền mảnh rõ ràng.
   Các bộ màu khác (Đỏ, Xanh, Tím, Ngọc, Than chì, Trắng) và Liquid Glass giữ nguyên giao diện cũ. */
:where(html:not([data-theme]):not([data-glass])){
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F2F2F2;
  --border:#E4E4E7; --border-strong:#D4D4D8;
  --ink:#0A0A0A; --ink-2:#3D3D3D; --muted:#71717A;
  --sh-1:none; --sh-2:0 4px 16px rgba(0,0,0,.06); --sh-3:0 12px 32px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04);
  --sb-bg:#FFFFFF; --sb-glow:none; --sb-ink:#0A0A0A; --sb-ink-2:#3D3D3D; --sb-ink-3:#8E8E8E; --sb-sec:#A3A3A3; --sb-line:#E4E4E7;
  --sb-hover:#F4F4F5; --sb-pill:#F2F2F2; --sb-pill-sh:none; --sb-accent:var(--brand-700);
}
:where(html:not([data-theme]):not([data-glass])) body{ background:#FFFFFF }
:where(html:not([data-theme]):not([data-glass])) ::-webkit-scrollbar-thumb{ background:#D4D4D8; background-clip:padding-box }

:where(html:not([data-theme]):not([data-glass])) .sb-tog, :where(html:not([data-theme]):not([data-glass])) .sb-out{ color:#8E8E8E }
:where(html:not([data-theme]):not([data-glass])) .nav-i[aria-current="page"]{ font-weight:800 } :where(html:not([data-theme]):not([data-glass])) .nav-i[aria-current="page"] i{ color:#0A0A0A }
:where(html:not([data-theme]):not([data-glass])) .nav-badge{ background:#FF3040; color:#fff }
:where(html:not([data-theme]):not([data-glass])) .tb{ box-shadow:none; border-bottom:1px solid #E4E4E7 } :where(html:not([data-theme]):not([data-glass])) .tb-t1 > i{ color:#0A0A0A }
:where(html:not([data-theme]):not([data-glass])) .card{ box-shadow:none; border-color:#E4E4E7 }
:where(html:not([data-theme]):not([data-glass])) .btn{ background:#FFFFFF; border-color:#D4D4D8; color:#0A0A0A }

:where(html:not([data-theme]):not([data-glass])) .btn.pri{ background:var(--brand-700); color:#fff; box-shadow:none } :where(html:not([data-theme]):not([data-glass])) .btn.pri::after{ display:none }

:where(html:not([data-theme]):not([data-glass])) .inp, :where(html:not([data-theme]):not([data-glass])) .ta, :where(html:not([data-theme]):not([data-glass])) .sel{ border-color:#D4D4D8 }
:where(html:not([data-theme]):not([data-glass])) .inp:focus, :where(html:not([data-theme]):not([data-glass])) .ta:focus{ border-color:#A1A1AA; box-shadow:none }

:where(html:not([data-theme]):not([data-glass])) #ov{ background:#FFFFFF } :where(html:not([data-theme]):not([data-glass])) #ov::before, :where(html:not([data-theme]):not([data-glass])) #ov::after{ opacity:.08 }

/* ── thông báo nhỏ: viên thuốc tối giữa màn hình, hiện nhanh, có nút Hoàn tác ── */
#toasts{ left:50%; right:auto; transform:translateX(-50%); align-items:center; width:max-content; max-width:calc(100vw - 24px) }
.toast{ min-width:0; max-width:min(460px, calc(100vw - 24px)); align-items:center; border-radius:14px; background:#262626; padding:10px 14px; font-size:13px; font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.2); animation:toastIn4 170ms cubic-bezier(.2,.9,.3,1) }
.toast i{ margin-top:0 } .toast.err{ background:#262626 } .toast.err i{ color:#FF6B6B }
.toast.out{ animation:toastOut4 170ms ease forwards }
.toast-a{ margin-left:6px; padding:0 0 0 12px; border:0; border-left:1px solid rgba(255,255,255,.18); background:none; color:#8AB4FF; font:800 13px var(--font-sans); cursor:pointer; white-space:nowrap }
@keyframes toastIn4{ from{ opacity:0; transform:translateY(12px) scale(.96) } to{ opacity:1; transform:none } }
@keyframes toastOut4{ to{ opacity:0; transform:translateY(8px) scale(.97) } }
@media (max-width:820px){ #toasts{ left:50% !important; right:auto !important; transform:translateX(-50%) } .toast{ font-size:13.5px } }

/* ── phản hồi bấm: lún nhanh, bật lại có độ nảy; nút xong thì đổi màu + dấu ✓ nảy lên ── */
.press{ transform:scale(.95) !important; transition:transform 70ms ease-out, background-color 70ms !important }
.btn.btn-done i{ animation:okIcon .34s cubic-bezier(.34,1.56,.64,1) }
@keyframes okIcon{ from{ transform:scale(.2) rotate(-30deg) } to{ transform:none } }
.row-done{ background:#F0FBF4 !important }
.row-out{ opacity:0 !important; transform:scale(.985) !important; height:0 !important; min-height:0 !important; padding-top:0 !important; padding-bottom:0 !important; margin-top:0 !important; margin-bottom:0 !important;
  border-width:0 !important; overflow:hidden; transition:height 190ms cubic-bezier(.4,0,.2,1), opacity 150ms, transform 190ms, padding 190ms, margin 190ms !important }

/* ── bảng lọc: một nút phễu → chọn trường ── */

.cq{ display:flex; flex-direction:column }

.cp-pane{ flex:1; min-height:0; display:flex; flex-direction:column } .cp-pane[hidden]{ display:none }
.cp-ta{ flex:1; min-height:220px; border:0; border-radius:0; background:var(--surface); font:12px/1.6 var(--font-mono); resize:none; padding:12px 14px }
.cp-foot{ display:flex; align-items:center; gap:6px; padding:8px 10px; border-top:1px solid var(--border) } .cp-foot .sp{ flex:1 }
.cp-tip{ align-items:flex-start; font-size:11.5px; color:var(--muted); line-height:1.45 } .cp-tip i{ color:var(--warn); margin-top:1px }
.cp-slots{ flex:1; min-height:0; overflow:auto; padding:8px }
.cp-slots .empty small{ font-size:11.5px } .cp-slots code{ font-size:11px; background:var(--surface-3); padding:1px 4px; border-radius:4px }
.cp-sh{ display:flex; justify-content:space-between; padding:4px 6px 8px; font-size:12px } .cp-sh span{ color:var(--muted) }
.cp-sl{ display:flex; gap:10px; padding:8px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; cursor:pointer; background:var(--surface) }
.cp-sl.on{ border-color:#ED5814; box-shadow:0 0 0 2px rgba(237,88,20,.16) }
.cp-tn{ position:relative; width:64px; height:64px; flex-shrink:0; border-radius:10px; background:var(--surface-3); display:grid; place-items:center; overflow:hidden; color:var(--muted); font-size:20px }
.cp-tn img{ width:100%; height:100%; object-fit:contain; background:#fff }
.cp-tn em{ position:absolute; left:4px; top:4px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:#ED5814; color:#fff; font:700 10.5px/18px var(--font-sans); text-align:center }
.cp-si{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px }
.cp-si > b{ font-size:12.5px } .cp-si > b span{ font-weight:500; color:var(--ink-2) } .cp-si > small{ font-size:11px; color:var(--muted); line-height:1.4 }
.cp-sc{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:4px }
select.sel.cp-mini{ height:28px; width:auto; font-size:12px; font-weight:600; padding:0 26px 0 9px; border:1px solid var(--border-strong); border-radius:8px; background-color:var(--surface); background-position:right 7px center; color:var(--ink) }
select.sel.cp-mini:hover, select.sel.cp-mini:focus{ border-color:#ED5814 }
/* nút trong Soạn phiếu: có nền + viền rõ, việc chính màu cam, việc xoá màu đỏ */
html .view.cp-view .btn.xs, html .view.cp-view .cp-foot .btn.sm, html .view.cp-view .cp-bar .btn{ height:28px; font-size:12px; font-weight:600; padding:0 10px; border-radius:8px; background:var(--surface); border:1px solid var(--border-strong); color:var(--ink); box-shadow:0 1px 1.5px rgba(15,23,42,.08) }
html .view.cp-view .btn.xs:hover, html .view.cp-view .cp-foot .btn.sm:hover, html .view.cp-view .cp-bar .btn:hover{ border-color:#ED5814; color:#C2410C; background:var(--surface) }
html .view.cp-view .btn.xs i, html .view.cp-view .cp-foot .btn.sm i, html .view.cp-view .cp-bar .btn i{ font-size:13px }
html .view.cp-view .btn.cp-go, html .view.cp-view .cp-foot .btn.sm.pri{ background:#ED5814; border-color:#ED5814; color:#fff; border-radius:8px }
html .view.cp-view .btn.cp-go:hover, html .view.cp-view .cp-foot .btn.sm.pri:hover{ background:#D24A0C; border-color:#D24A0C; color:#fff }
html .view.cp-view .btn.cp-del{ background:#FEF3F2; border-color:#F3B8B2; color:#B42318 } html .view.cp-view .btn.cp-del:hover{ background:#FDE4E1; border-color:#D92D20; color:#B42318 }
html .view.cp-view .btn.cp-big{ height:34px; font-size:13px; padding:0 14px }
.cp-sc .ibtn.sm{ width:28px; height:28px; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface); color:var(--ink) }
/* thanh chèn nhanh phía trên ô Mã */
.cp-bar{ display:flex; flex-wrap:wrap; gap:6px; padding:8px 10px; border-bottom:1px solid var(--border); background:var(--surface-2, var(--surface)) }
.cp-bar > small{ flex-basis:100%; font-size:11.5px; color:var(--muted); line-height:1.4 }
.cp-how{ display:flex; align-items:center; gap:8px; margin:8px 10px 0; padding:8px 10px; border-radius:10px; background:#FFF4EC; border:1px solid #F8C9A8; color:#7C2D12; font-size:12px; line-height:1.4; cursor:pointer } .cp-how i{ font-size:16px; color:#ED5814 } .cp-how b{ color:#C2410C }
/* thanh định dạng kiểu Google Docs: một hàng nút icon, menu Chèn chỉ sổ xuống khi bấm */
.cp-tb{ align-items:center; gap:2px; padding:6px 8px }
.cp-side{ overflow:clip }                                  /* không cho khung Mã bị trượt ngang khi con trỏ / menu chạm mép */
.cp-ib{ width:30px; height:30px; display:inline-grid; place-items:center; border:1px solid transparent; border-radius:7px; background:transparent; color:var(--ink); font-size:16px; cursor:pointer }
.cp-ib:hover{ background:var(--surface-3); border-color:var(--border-strong) } .cp-ib:active{ background:#FFE7D6; color:#C2410C }
.cp-sep{ width:1px; height:20px; margin:0 4px; background:var(--border-strong) }
.cp-dd{ position:relative; display:inline-flex } .cp-dd > .btn{ gap:5px }
.cp-menu{ position:absolute; right:0; top:calc(100% + 4px); z-index:30; min-width:210px; display:flex; flex-direction:column; padding:5px; border:1px solid var(--border-strong); border-radius:10px; background:var(--surface); box-shadow:0 10px 28px rgba(15,23,42,.18) } .cp-menu[hidden]{ display:none }
.cp-menu button{ display:flex; align-items:center; gap:9px; padding:8px 10px; border:0; border-radius:7px; background:none; color:var(--ink); font:600 12.5px var(--font-sans); text-align:left; cursor:pointer } .cp-menu button:hover{ background:#FFF1E7; color:#C2410C } .cp-menu i{ font-size:14px; color:#ED5814 }
/* hộp hướng dẫn từng bước */
.cp-gd{ display:flex; flex-direction:column; gap:10px; max-height:68vh; overflow:auto; padding-right:4px }
.cp-gd h4{ margin:8px 0 0; font-size:14px; color:var(--ink) } .cp-gd h4:first-child{ margin-top:0 }
.cp-gs{ display:flex; gap:12px; padding:10px 12px; border:1px solid var(--border); border-radius:12px; background:var(--surface) }
.cp-gs > em{ flex:0 0 28px; height:28px; border-radius:50%; background:#ED5814; color:#fff; font:700 13px/28px var(--font-sans); font-style:normal; text-align:center }
.cp-gs > div{ flex:1; min-width:0; font-size:13px; line-height:1.55 } .cp-gs b.t{ display:block; font-size:13.5px; margin-bottom:2px }
.cp-gs kbd, .cp-gd code{ font:600 11.5px var(--font-mono); background:var(--surface-3); border:1px solid var(--border); border-radius:5px; padding:1px 5px; white-space:nowrap }
html .cp-gd .btn{ height:26px; font-size:11.5px; font-weight:600; padding:0 9px; border-radius:8px; background:var(--surface); border:1px solid var(--border-strong); color:var(--ink) } html .cp-gd .btn.cp-go{ background:#ED5814; border-color:#ED5814; color:#fff } html .cp-gd .btn.cp-del{ background:#FEF3F2; border-color:#F3B8B2; color:#B42318 }
.cp-gs .btn, .cp-gt .btn{ pointer-events:none; vertical-align:middle; margin:0 2px } .cp-gs ul{ margin:4px 0 0; padding-left:18px } .cp-gs li{ margin:2px 0 }
.cp-gt{ width:100%; border-collapse:collapse; font-size:12.5px } .cp-gt td{ padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:top } .cp-gt td:first-child{ white-space:nowrap; width:1% }
.cp-ck{ display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--ink-2); cursor:pointer }
.cp-w{ display:inline-flex; align-items:center; gap:6px; font-size:11px } .cp-w input{ width:92px; accent-color:#ED5814 } .cp-w em{ font-style:normal; color:var(--muted); min-width:34px }
.cp-prev{ min-width:0; min-height:0; display:flex; flex-direction:column }
.cp-stat{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:10px 16px 0; min-height:30px; font-size:12px; color:var(--muted) } .cp-stat i{ margin-right:5px }
.cp-stat em{ font-style:normal; font-weight:700; color:#C2410C } .cp-stat .warn{ color:var(--danger) }
/* soát mã AI trả về */
.cp-lint{ font-weight:700; color:#9A3412; background:#FFF4EC; border-color:#F8C9A8 } .cp-lint.err{ color:#fff; background:var(--danger); border-color:var(--danger) } .cp-lint i{ margin-right:5px }
.cp-lt{ display:grid; gap:8px } .cp-li{ display:flex; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:12px; background:var(--surface); font-size:13px; line-height:1.5 }
.cp-li > i{ flex:0 0 auto; margin-top:2px; color:var(--warn) } .cp-li.err > i{ color:var(--danger) } .cp-li > div{ flex:1; min-width:0 } .cp-la{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px } .cp-la:empty{ display:none }
.cp-pages{ flex:1; min-height:0; overflow:auto; padding:12px; display:flex; flex-direction:column; align-items:center; gap:16px }
.cp-empty{ margin:auto; max-width:380px } .cp-empty > i{ font-size:34px } .cp-empty b{ color:var(--ink) }
.cp-pre{ white-space:pre-wrap; font:12px/1.55 var(--font-mono); background:var(--surface-3); border-radius:10px; padding:12px 14px; max-height:62vh; overflow:auto; margin:0 }
@media (max-width:820px){
  .cp-hs{ display:none }
  .cp-lay{ display:flex; flex-direction:column; overflow:auto }
  .cp-side{ flex:0 0 auto; height:52vh; margin:8px }
  .cp-pages{ flex:0 0 auto; overflow:visible; padding:8px }
}

/* ── trang A4 ── cỡ chữ phân tầng: tên phiếu 20pt · HOẠT ĐỘNG 16pt · NHIỆM VỤ 14pt · nhãn thẻ 12pt · nội dung 13pt giãn dòng 1,5 */
.kg-sheet{ position:relative; flex-shrink:0; background:#fff; box-shadow:0 1px 3px rgba(15,23,42,.10), 0 6px 18px rgba(15,23,42,.08) }
.kg-page{ --lp:30pt; position:absolute; left:0; top:0; transform-origin:0 0; width:595.28pt; height:841.89pt; overflow:hidden; background:#fff; color:#111; text-align:left;
  font:13pt/1.5 "Times New Roman", Times, serif; -webkit-print-color-adjust:exact; print-color-adjust:exact }
.kg-page *, .kg-page *::before, .kg-page *::after{ box-sizing:border-box }
/* đầu trang: logo | MÔN bên trái · viên chủ đề bên phải */
.kg-hd{ position:absolute; left:42pt; right:42pt; top:12pt; height:28pt; display:flex; align-items:center; gap:10pt; font-family:Arial, Helvetica, sans-serif }
.kg-hd img{ height:26pt; width:auto } .kg-hd .sp{ flex:1 } .kg-hd > i{ width:.8pt; height:17pt; background:#C9D6CD }
.kg-hd > b{ font-size:9.5pt; font-weight:700; color:#036528; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap }
.kg-pill{ display:inline-flex; align-items:center; gap:5pt; height:18pt; padding:0 10pt 0 9pt; border-radius:9pt; background:#E8F3EC; border:.8pt solid #BFD9C8; font-size:9pt; color:#024A1D; white-space:nowrap }
.kg-pill i{ width:5.7pt; height:5.7pt; border-radius:1.3pt; background:#ED5814 }
.kg-hl{ position:absolute; left:42pt; right:42pt; top:46pt; height:1pt; background:#DCE9E1 }
.kg-hl::before{ content:''; position:absolute; left:0; top:-.5pt; width:68pt; height:2pt; background:#ED5814 }
.kg-body{ position:absolute; left:42pt; right:42pt; top:60pt; height:752pt }
.kg-body > *{ margin-top:0 }
/* chân trang: chỉ số trang (không chữ thương hiệu — không làm đứt mạch đọc) */
.kg-ft{ position:absolute; left:42pt; right:42pt; top:818pt; height:16pt; display:flex; align-items:center; gap:5pt; font:8pt Arial, Helvetica, sans-serif; color:#6A726C }
.kg-ft .sp{ flex:1 } .kg-ft small{ font-size:7.5pt; letter-spacing:.06em }
.kg-no{ font-weight:700; color:#036528; font-size:8.5pt }
/* số trang: vị trí do người dùng chọn (ô “Số trang”) · ô nét đứt để điền tay */
.kg-no.box{ width:35pt; height:15.5pt; border:.8pt dashed #7C93B4; border-radius:3pt } .kg-ft[data-pn="l"] .sp, .kg-ft[data-pn="c"] .sp{ display:none } .kg-ft[data-pn="c"]{ justify-content:center }
.cp-pns{ width:62px; height:28px; padding:0 6px; font-size:12px; font-weight:600; border-radius:8px; text-align:center }
/* băng tiêu đề trang 1: Buổi · Phiếu học tập số · thời gian, rồi tên phiếu 20pt */
.kg-ban{ background:#036528; color:#fff; border-radius:8pt 8pt 5pt 5pt; border-bottom:4.5pt solid #ED5814; padding:11pt 22pt 12pt; margin-bottom:12pt; font-family:Arial, Helvetica, sans-serif }
.kg-chips{ display:flex; flex-wrap:wrap; gap:6pt }
.kg-chips span{ display:inline-flex; align-items:center; gap:4pt; background:rgba(255,255,255,.16); color:#fff; font-size:8.5pt; font-weight:700; letter-spacing:.06em; padding:3pt 8pt; border-radius:4pt; text-transform:uppercase }
.kg-chips span:first-child{ background:#ED5814 } .kg-chips svg{ width:9pt; height:9pt }
.kg-ban h1{ margin:8pt 0 0; font-size:20pt; line-height:1.2; font-weight:700; color:#fff; text-transform:uppercase }
.kg-page.cam .kg-ban{ background:#ED5814; border-bottom-color:#036528 } .kg-page.cam .kg-chips span:first-child{ background:#036528 }
.kg-name{ display:flex; align-items:flex-end; gap:8pt; margin-bottom:14pt; font:700 7.6pt Arial, Helvetica, sans-serif; color:#5A6660; letter-spacing:.14em }
.kg-name label{ margin-left:12pt; white-space:nowrap } .kg-name label:first-child{ margin-left:0 }
.kg-name i{ flex:1.5; height:9pt; border-bottom:.8pt solid #7FA08D } .kg-name i.w{ flex:4 } .kg-name i:last-child{ flex:2.3 }
/* HOẠT ĐỘNG 16pt · NHIỆM VỤ 14pt */
.kg-h2{ display:flex; align-items:center; gap:10pt; padding-bottom:5pt; margin:2pt 0 10pt; border-bottom:1pt solid #036528; font-family:Arial, Helvetica, sans-serif }
.kg-h2 span{ flex-shrink:0; background:#036528; color:#fff; font-size:11pt; font-weight:700; line-height:1; padding:5pt 8pt; border-radius:3pt; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap }
.kg-h2 b{ font-size:16pt; color:#1C2420; text-transform:uppercase; line-height:1.25 }
.kg-h1{ margin:0 0 12pt; padding-bottom:7pt; text-align:center; font:700 15pt/1.25 Arial, Helvetica, sans-serif; color:#036528; text-transform:uppercase; letter-spacing:.03em; background:linear-gradient(#ED5814, #ED5814) center bottom / 54pt 2.2pt no-repeat }
.kg-h3{ margin:0 0 8pt; font-size:14pt; line-height:1.45; color:#1C2420 }
.kg-h3 span{ font:700 14pt Arial, Helvetica, sans-serif; color:#ED5814; margin-right:4pt; text-transform:uppercase }
/* chữ */
.kg-p{ margin:0 0 5pt; text-align:justify } .kg-body > .kg-p{ margin-bottom:8pt }
.kg-ul{ margin:0 0 5pt; padding:0; list-style:none } .kg-ul li{ margin:0 0 3pt; padding-left:14pt; text-indent:-14pt }
.kg-ul li::before{ content:'–'; display:inline-block; width:14pt; text-indent:0 }      /* gạch đầu dòng nằm đúng dòng chữ đầu (kể cả dòng có phân số cao) */
/* môn tự nhiên: dấu đầu dòng là CHẤM TRÒN — gạch ngang đứng trước con số dễ bị đọc thành số âm */
.kg-page.stem .kg-ul li::before{ content:'•'; font-weight:700; color:#036528 } .kg-page.stem.tdn .kg-ul li::before{ color:#EE5B27 }
.kg-gap{ height:10pt }
/* xuống dòng đẹp: tiêu đề chia dòng cân nhau, đoạn văn không để dòng cuối chỉ còn một chữ */
.kg-ban h1, .kg-h1, .kg-h2 b, .kg-kt{ text-wrap:balance } .kg-p, .kg-ul li, .kg-h3, .kg-mc > div{ text-wrap:pretty }
/* công thức (KaTeX) */
.kg-page .katex{ font-size:1.05em; text-transform:none; letter-spacing:0 } .kg-eq{ margin:4pt 0 8pt; text-align:center } .kg-eq .katex-display{ margin:0 }
.kg-tex{ font-family:"Times New Roman", serif; font-style:italic; color:#6A726C }
.kg-src{ margin-top:6pt; text-align:right; font-size:12pt; font-style:italic; color:#4F5A53 }
/* thẻ: nền đậm hơn + viền + thanh nhấn trái */
.kg-the{ display:flow-root; background:#E6F2EA; border:1pt solid #B5D3BF; border-left:4pt solid #036528; border-radius:0 6pt 6pt 0; padding:9pt 14pt 10pt; margin-bottom:12pt }
.kg-the.cam{ background:#FDE9DB; border-color:#F2BE9C; border-left-color:#ED5814 }
/* nhãn thẻ: chữ trắng trên nền đặc (không trùng màu khung → không bị mờ) */
.kg-lb{ display:inline-block; font:700 11pt/1.2 Arial, Helvetica, sans-serif; color:#fff; background:#036528; letter-spacing:.04em; text-transform:uppercase; padding:3.5pt 8pt; border-radius:4pt; margin-bottom:7pt }
.kg-the.cam > .kg-lb{ background:#ED5814; color:#fff }
/* mẫu Kiến Gia Sư: nhãn câu hỏi (CÂU 1, BÀI 2…) đứng cùng dòng với câu hỏi — nhãn thấp hơn một dòng chữ nên không đẩy giãn dòng đầu */
.kg-lb.in{ margin:0 7pt 0 0; padding:2pt 7pt 1.5pt; font-size:10.5pt; vertical-align:1pt; text-indent:0; white-space:nowrap }
/* công thức ngắn dính với ngoặc / dấu câu / đơn vị sát nó: “(km²)”, “5¼ ha” không bị tách dòng */
.kg-nb{ white-space:nowrap }
.kg-mt{ margin-bottom:14pt }
.kg-the > :last-child, .kg-kh > :last-child, .kg-grp > :last-child{ margin-bottom:0 }
/* trắc nghiệm: đáp án A–D nằm ngoài thẻ, ngay dưới câu hỏi */
.kg-q{ margin-bottom:12pt } .kg-q > .kg-the{ margin-bottom:0 } .kg-q > .kg-mc{ margin:7pt 0 0 18pt }
.kg-mc{ display:grid; gap:5pt 14pt; margin:7pt 0 0 } .kg-mc.c4{ grid-template-columns:repeat(4, minmax(0, 1fr)) } .kg-mc.c2{ grid-template-columns:repeat(2, minmax(0, 1fr)) }
.kg-mc.c5{ grid-template-columns:repeat(5, minmax(0, 1fr)) } .kg-mc.c3{ grid-template-columns:repeat(3, minmax(0, 1fr)) }      /* đề 5 đáp án A–E */
.kg-mc b{ font:700 12pt Arial, Helvetica, sans-serif; color:#036528; margin-right:3pt }
/* khung đọc: nền trắng, viền xanh */
.kg-kh{ display:flow-root; background:#fff; border:1pt solid #B5D3BF; border-radius:6pt; padding:12pt 18pt; margin-bottom:12pt }
.kg-kt{ font:700 14pt Arial, Helvetica, sans-serif; color:#036528; text-align:center; text-transform:uppercase; margin-bottom:10pt }
.kg-kh.tho .kg-p{ text-align:center; margin:0 } .kg-kh.tho .kg-gap{ height:12pt }
.kg-kh.van .kg-p{ text-indent:22pt; margin-bottom:3pt }
.kg-kh.kg-cut{ border-bottom-style:dashed; border-bottom-left-radius:0; border-bottom-right-radius:0; margin-bottom:0 }
.kg-kh.kg-cont{ border-top-style:dashed; border-top-left-radius:0; border-top-right-radius:0; padding-top:10pt }
.kg-the.kg-cut{ border-bottom-right-radius:0; margin-bottom:0 } .kg-the.kg-cont{ border-top-right-radius:0 }
/* câu hỏi + chỗ viết (không tách rời) */
.kg-grp{ display:flow-root; margin-bottom:14pt }
/* hai câu con ngắn (a. b.) xếp hai cột — dòng kẻ hai cột thẳng hàng (canh theo đáy) */
.kg-two{ display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:0 22pt; align-items:end; margin-bottom:14pt } .kg-two > .kg-grp, .kg-two .kg-dong{ margin-bottom:0 }
.kg-two .kg-p, .kg-p.sub{ text-align:left }
/* dãy ý con ngắn chỉ điền vào chỗ chấm (a. … b. … c. …) → lưới hai cột; một ý không vừa nửa trang thì về một cột (.one) */
.kg-subs{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6pt 22pt; align-items:baseline; margin-bottom:10pt } .kg-subs.one{ grid-template-columns:minmax(0, 1fr) }
.kg-subs > .kg-p{ margin:0; text-align:left } .kg-the > .kg-subs{ margin:2pt 0 5pt }
/* hình một bên – thẻ câu hỏi + đáp án / dòng kẻ làm bài bên kia (cpFigFit): thẻ, lưới đáp án và từng dòng kẻ tự né hình; dòng dưới đáy hình dài hết bề ngang */

@media (max-width:640px){ .hm-g3{ gap:12px } .hm-ar{ gap:8px; padding:7px } .hm-at{ width:48px } .hm-ar .btn.xs{ padding:0 9px } }

/* ══════════════════════════════════════════════════════════════
   GIAO DIỆN 4 (13-10-2026) — khung theo template MatDash (themewagon.com/themes/matdash-nextjs), GIỮ bộ màu Kiến Trẻ.
   Lấy của MatDash: nền trang trắng · thanh bên trắng không viền, mục đang mở = nền xanh nhạt + chữ xanh (KHÔNG vạch màu bên cạnh)
     · vùng nội dung là MỘT khối bo 24px nền xanh rất nhạt · thẻ trắng bo 14px không viền, bóng 1px · nút bo 8px · nhãn bo 6px nền màu nhạt
     · tab chọn: nền trắng, mục đang chọn tô xanh · bảng không nền tiêu đề, kẻ dòng mảnh · chữ Manrope 14/20.
   Giữ của Kiến Trẻ: xanh #204983 · nền nhạt #EEF4FC · nền nhấn #FFF0E5 + cam logo chỉ cho việc cần chú ý · con diều trong vòng tròn.
   Quy tắc: mọi nút / ô nhập / tab có đủ hover · focus-visible (viền 2px xanh) · active · disabled; chữ đạt tương phản AA;
            nút không đổi bề rộng / vị trí khi chữ bên trong đổi; điện thoại: không có hàng nút nào phải vuốt ngang mới thấy.
   Khối này phủ lên các luật phía trên — sửa khung ở đây.
   ══════════════════════════════════════════════════════════════ */
:root, html[data-theme]{
  --brand-950:#0C1E3A; --brand-900:#132C55; --brand-800:#1A3B6C; --brand-700:#204983; --brand-600:#2D5DA3; --brand-500:#4A78BD; --brand-400:#8FB0DE;
  --brand-100:#D9E6F7; --brand-50:#EEF4FC;
  --primary:#204983; --on-primary:#FFFFFF; --accent:#204983; --accent-soft:#D9E6F7; --lightprimary:#E6ECF5; --orange:#F3663D; --orange-ink:#B93F12; --peach:#FFF0E5;
  --bg:#EEF4FC; --page:#FFFFFF; --surface:#FFFFFF; --surface-2:#F7FAFE; --surface-3:#EEF4FC;
  --border:#E0E6EB; --border-strong:#C9D3DE;
  --ink:#1F1F1F; --ink-2:#2A3547; --muted:#5F6B7A;
  --ring:rgba(32,73,131,.22);
  --r-s:6px; --r-m:8px; --r-l:14px; --r-xl:24px;
  --sh-1:0 1px 2px rgba(0,0,0,.05); --sh-2:0 1px 4px rgba(133,146,173,.28), 0 6px 16px -8px rgba(32,73,131,.18); --sh-3:0 16px 40px -12px rgba(31,42,61,.24), 0 2px 6px rgba(31,42,61,.08);
  --font-sans:Manrope, 'Manrope Fallback', Montserrat, 'Segoe UI', Roboto, Arial, Helvetica, sans-serif;
  --t-fast:75ms; --t-base:300ms; --t-slow:300ms;
  --sb-w:260px; --sb-w-min:76px; --tb-h:72px;
  --sb-bg:var(--surface); --sb-glow:none; --sb-ink:var(--ink); --sb-ink-2:var(--ink-2); --sb-ink-3:var(--muted); --sb-sec:var(--ink-2); --sb-line:transparent;
  --sb-hover:var(--lightprimary); --sb-pill:var(--lightprimary); --sb-pill-sh:none; --sb-accent:var(--primary);
  /* tên biến của bản trước (Task, trang Apps còn dùng) trỏ về token mới */
  --k-ink:var(--primary); --k-tray:var(--surface-3); --k-hair:var(--border); --k-sh:var(--sh-1); --k-spring:var(--ease); --k-pop:var(--ease);
}
body{ background:var(--page); background-image:none; font-family:var(--font-sans); color:var(--ink-2) }
.app, .main{ background:transparent }
h1, h2, h3, h4{ color:var(--ink) }
@keyframes kRise{ from{ opacity:0; transform:translateY(8px) } to{ opacity:1; transform:none } }
@keyframes kPop{ from{ opacity:0; transform:scale(.96) } to{ opacity:1; transform:none } }
.view.va > *{ animation:kRise 300ms var(--ease) both }
.view.va > *:nth-child(2){ animation-delay:40ms } .view.va > *:nth-child(n+3){ animation-delay:80ms }
/* focus nhìn thấy được ở mọi phần tử bấm được */
.btn:focus-visible, .ibtn:focus-visible, .nav-i:focus-visible, .seg-b:focus-visible, .md-card:focus-visible, .tk-pill:focus-visible, .tk-fbtn:focus-visible, .ob-pill:focus-visible, .tb-search:focus-visible, .rcell:focus-visible, .bn-i:focus-visible{ outline:2px solid var(--primary); outline-offset:2px }

/* ── thẻ, nút, ô nhập, tab chọn, nhãn, bảng ── */
.card{ border:0; border-radius:var(--r-l); box-shadow:var(--sh-1); background:var(--surface) }
.card-h{ border-bottom:0; padding:18px 20px 10px } .card-h h2{ font-size:16px; line-height:24px; font-weight:600; color:var(--ink); letter-spacing:0 } .card-h h2 > i{ color:var(--primary) }
.card-b{ padding:20px } .card-h + .card-b{ padding-top:6px }
.card > .tbl-wrap:last-child, .card > .tbl-wrap:last-child table{ border-radius:0 0 var(--r-l) var(--r-l) }
.btn{ height:38px; padding:0 18px; border:1px solid var(--border-strong); border-radius:var(--r-m); background:var(--surface); color:var(--ink-2); box-shadow:none; font-size:13.5px; font-weight:500; letter-spacing:0;
  transition:background var(--t-fast), border-color var(--t-fast), color var(--t-fast), box-shadow var(--t-base) }
.btn.sm{ height:32px; padding:0 12px; font-size:12.5px } .btn.xs{ height:26px; padding:0 9px; font-size:11.5px; border-radius:var(--r-s) }
.btn:hover{ background:var(--lightprimary); border-color:var(--primary); color:var(--primary); transform:none }
.btn:active:not(:disabled){ transform:none; background:var(--brand-100) }
.btn:disabled{ opacity:.5 }
.btn.pri, html[data-glass] .btn.pri{ background:var(--primary) !important; background-image:none !important; border-color:var(--primary); color:#fff; border-radius:var(--r-m); box-shadow:none !important; font-weight:600 }
.btn.pri::after{ display:none }
.btn.pri:hover{ filter:none; background:var(--brand-800) !important; border-color:var(--brand-800); color:#fff }
.btn.pri:active:not(:disabled){ background:var(--brand-900) !important }
.btn.ghost{ background:transparent; border-color:transparent } .btn.ghost:hover{ background:var(--lightprimary); border-color:transparent; color:var(--primary) }
.ibtn{ border-radius:50%; color:var(--ink-2) } .ibtn:hover{ background:var(--lightprimary); color:var(--primary) }
.seg{ padding:4px; gap:4px; border-radius:var(--r-m); background:var(--surface); box-shadow:inset 0 0 0 1px var(--border) }
.seg-b{ border-radius:var(--r-s); font-size:12.5px; font-weight:500; color:var(--ink-2); transition:background var(--t-fast), color var(--t-fast) }
.seg-b:hover{ background:var(--lightprimary); color:var(--primary) }
.seg-b[aria-pressed="true"], .seg-b[aria-pressed="true"]:hover{ color:#fff; background:var(--primary); box-shadow:var(--sh-1) } .seg-b[aria-pressed="true"] i{ color:inherit }
.inp, select.sel, .ta{ height:38px; border:1px solid var(--border-strong); background-color:var(--surface); border-radius:var(--r-m); font-size:13.5px; color:var(--ink) }
.inp.sm{ height:32px; font-size:12.5px }
.inp:hover, select.sel:hover, .ta:hover{ border-color:var(--brand-500); background-color:var(--surface) }
.inp:focus, select.sel:focus, .ta:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--ring) }
.badge{ height:24px; padding:0 10px; border-radius:var(--r-s); font-size:12px; font-weight:600 } .tag{ border-radius:var(--r-s); border-color:transparent; background:var(--lightprimary); color:var(--primary); font-weight:600 }
.chip{ border-radius:var(--r-m); background:var(--surface); border-color:var(--border) }
.modal{ border-radius:var(--r-l); box-shadow:var(--sh-3) } .modal-h{ border-bottom:0; padding:20px 24px 8px } .modal-h h3{ font-size:18px; font-weight:600 } .modal-h h3 i{ color:var(--primary) }
.modal-f{ border-top:0; background:transparent; padding:12px 24px 20px; border-radius:0 0 var(--r-l) var(--r-l) }
.menu{ padding:6px; border:1px solid var(--border); border-radius:10px; box-shadow:var(--sh-3); max-height:min(70vh, 520px); overflow-y:auto }
.menu button{ border-radius:var(--r-s) } .menu button:hover{ background:var(--lightprimary); color:var(--primary) } .menu button > i.bi-check-circle-fill{ color:var(--primary) }
.tbl th, .tbl thead th{ background:var(--surface); box-shadow:inset 0 -1px 0 var(--border); font-size:13px; font-weight:600; letter-spacing:0; text-transform:none; color:var(--ink); padding-top:14px; padding-bottom:14px }
.tbl td{ border-bottom-color:var(--border) } .tbl tbody tr.link:hover{ background:var(--surface-2) }
.rcell.on{ background:var(--primary); border-color:var(--primary) }
.av{ background:var(--primary); display:inline-grid !important; place-items:center; justify-content:center; text-align:center; line-height:1; letter-spacing:0; font-weight:700; overflow:hidden }      /* chữ viết tắt luôn nằm giữa vòng tròn, ở mọi nơi */
.av.sm{ width:24px; height:24px; font-size:9.5px }
.empty > i{ color:var(--brand-400) }
/* nút trạng thái đồng bộ: bề rộng cố định, chữ đổi (Đã đồng bộ / Đang lưu…) không làm nút co giãn */
@media (min-width:821px){
  .ob-pill{ width:148px; flex:0 0 148px; height:38px; padding:0 12px; border:1px solid var(--border); border-radius:999px; box-shadow:none; background:var(--surface); justify-content:center; overflow:hidden; font-weight:600 }
  .ob-pill span{ flex:0 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  #aSave, #rSaveR{ min-width:104px } #tkNew{ min-width:116px }
}

@media (min-width:821px){
  /* ── thanh bên trắng, không viền: logo · tên ứng dụng (chữ hoa nhỏ) · tab của ứng dụng · tab chung + Apps ở đáy ── */
  .app .sb{ background:var(--surface); border-right:0; box-shadow:none; margin:0; height:100dvh; border-radius:0 }
  .sb::before, .sb::after{ display:none }
  .sb-brand{ height:var(--tb-h); min-height:0; padding:0 14px 0 24px; gap:12px; border-bottom:0; flex-direction:row; justify-content:flex-start }
  .sb-logo{ width:40px; height:40px; flex-shrink:0; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--border-strong); background:var(--kite) 54% 52%/auto 64% no-repeat, var(--surface-3) !important; transition:opacity var(--t-fast) }      /* con diều (không dùng chữ của logo) nằm trong vòng tròn */
  .sb-logo i{ display:none } .sb-brand:hover .sb-logo{ transform:none }
  .app .sb-ver, .app .sb-n2{ display:none !important }
  .sb-name{ min-width:0; flex:1 1 auto } .sb-n1{ font-size:17px; line-height:20px; font-weight:800; letter-spacing:-.01em; color:var(--primary); text-transform:none; white-space:normal; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow-wrap:normal } .sb-nw{ white-space:nowrap }      /* tên ứng dụng đang mở (Kiến Chuyên môn · Kiến Task…) */
  .sb-tog{ color:var(--muted); opacity:1; transform:none; border-radius:50% } .sb-tog:hover{ background:var(--lightprimary); color:var(--primary) }
  /* thu gọn: nút mở rộng chỉ hiện khi rê chuột vào logo (logo mờ đi) — không còn đè lên nhau */
  .app.mini .sb-tog{ opacity:0; transform:none; margin:-18px 0 0 -18px } .app.mini .sb-brand:hover .sb-tog, .app.mini .sb-tog:focus-visible{ opacity:1 } .app.mini .sb-brand:hover .sb-logo{ opacity:0 }
  .md-sw{ display:none !important }

  border:0; border-radius:var(--r-l); background:var(--surface); box-shadow:var(--sh-1); transition:box-shadow var(--t-base), transform var(--t-base) var(--ease), background var(--t-fast); animation:kRise 300ms var(--ease) both; animation-delay:calc(var(--i, 0) * 40ms) }

/* ══════════ HOẠT ĐỘNG › Phân tích sử dụng: khung giờ cao điểm · ứng dụng dùng nhiều nhất ══════════ */

  <style>
    /* ══════════ TRANG XEM LINK TẠM (công khai) ══════════ */
    html, body{ height:100% } body{ overflow:hidden; background:#DDE2EA }
    .sh{ height:100vh; height:100dvh; display:flex; flex-direction:column }
    .sh-h{ flex-shrink:0; display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); box-shadow:var(--sh-1); position:relative; z-index:5 }
    .sh-logo{ width:40px; height:40px; flex-shrink:0; border-radius:50%; background:var(--kite) 54% 52%/auto 64% no-repeat, #EEF4FC; box-shadow:inset 0 0 0 1.5px var(--border-strong) }      /* logo app: cánh diều Kiến Trẻ (Brand.html) */
    .sh-t{ flex:1; min-width:0 }
    .sh-t small{ display:block; font-size:10.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--brand-700) }
    .sh-t h1{ margin:1px 0 0; font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .sh-t .meta{ font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .sh-a{ display:flex; align-items:center; gap:6px; flex-shrink:0 }
    .sh-zoom{ display:flex; align-items:center; gap:2px; padding:3px; border-radius:999px; background:var(--surface-3); border:1px solid var(--border) }
    .sh-zoom .ibtn{ width:30px; height:30px; border-radius:999px }
    .sh-zoom span{ min-width:46px; text-align:center; font:700 11.5px var(--font-mono); color:var(--ink-2); cursor:pointer }
    .sh-b{ flex:1; min-height:0; display:flex; position:relative }
    .sh-toc{ width:290px; flex-shrink:0; overflow:auto; background:var(--surface); border-right:1px solid var(--border); padding:12px 10px 30px }
    .sh-toc .hd{ font-size:10px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); padding:4px 8px 8px }
    .tc{ display:flex; gap:10px; align-items:flex-start; width:100%; padding:8px 10px; border:0; border-radius:12px; background:none; text-align:left; cursor:pointer; color:var(--ink); transition:background var(--t-fast) }
    .tc:hover{ background:var(--surface-3) }
    .tc.on{ background:var(--brand-50); box-shadow:inset 3px 0 0 var(--brand-600) }
    .tc .no{ width:24px; height:24px; flex-shrink:0; border-radius:8px; display:grid; place-items:center; font:800 11px var(--font-mono); background:var(--surface-3); color:var(--ink-2) }
    .tc.on .no{ background:var(--brand-700); color:#fff }
    .tc .tx{ min-width:0; flex:1 } .tc b{ display:block; font-size:12.5px; font-weight:700; line-height:1.35; word-break:break-word }
    .tc small{ display:block; font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px }
    .tc .st{ font-size:10.5px; color:var(--muted); flex-shrink:0; margin-top:3px; font-variant-numeric:tabular-nums }
    .tc .st .spin{ display:inline-block; width:11px; height:11px; border-radius:50%; border:2px solid var(--border-strong); border-top-color:var(--brand-600); animation:spin .8s linear infinite }
    @keyframes spin{ to{ transform:rotate(360deg) } }
    .sh-m{ flex:1; min-width:0; overflow:auto; padding:18px 12px 80px; -webkit-overflow-scrolling:touch }
    .sec{ display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:26px }
    .sec-t{ align-self:stretch; max-width:1000px; width:100%; margin:0 auto; display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:14px; background:rgba(255,255,255,.75); border:1px solid rgba(255,255,255,.9); box-shadow:var(--sh-1) }
    .sec-t .no{ width:26px; height:26px; flex-shrink:0; border-radius:9px; display:grid; place-items:center; font:800 12px var(--font-mono); background:var(--brand-700); color:#fff }
    .sec-t b{ font-size:13px; min-width:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .sec-t small{ font-size:11px; color:var(--muted); white-space:nowrap }
    .sec .ph{ width:min(1000px, 100%); aspect-ratio:1 / 1.414; background:#fff; border-radius:2px; box-shadow:0 2px 14px rgba(20,30,50,.18); position:relative; overflow:hidden }
    .sec .ph::after{ content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(220,226,234,.6), transparent); background-size:200% 100%; animation:sweep 1.2s linear infinite }

<script>
/* ══════════════════════════════════════════════════════════════
   SỐ TRANG TRÊN BẢN GHÉP — dùng chung cho trình thiết kế (Link tạm), trang xem, bản in và PDF tải về.
   Box theo tỉ lệ trang: x, y (góc trên trái), w, h ∈ [0..1]; cỡ chữ / bo góc theo tỉ lệ bề rộng trang.
   ══════════════════════════════════════════════════════════════ */
const PNK = {
  /** box thực tế: 6 vị trí có sẵn → toạ độ cố định; 'custom' → giữ nguyên box người dùng kéo */
  box(pn) {
    if (!pn || !pn.pos || pn.pos === 'none') return null;
    if (pn.pos === 'custom') return pn;
    const a = pn.pos[1], v = pn.pos[0];
    return Object.assign({}, pn, { w: 0.22, h: 0.032, x: { l: 0.05, c: 0.39, r: 0.73 }[a], y: v === 't' ? 0.02 : 0.948, align: a });
  },
  text(fmt, n, N) {
    return fmt === 'n' ? String(n) : fmt === 'p' ? 'Trang ' + n : fmt === 'p/N' ? 'Trang ' + n + ' / ' + N : n + ' / ' + N;
  },
  /** style CSS cho box nằm trên một trang rộng W px */
  css(b, W) {
    return 'left:' + (b.x * 100) + '%;top:' + (b.y * 100) + '%;width:' + (b.w * 100) + '%;height:' + (b.h * 100) + '%;' +
      'font-size:' + Math.max(5, b.size * W) + 'px;font-weight:' + (b.bold ? 700 : 400) + ';color:' + (b.color || '#333') + ';' +
      'background:' + (b.bg || 'transparent') + ';border:' + (b.border ? Math.max(1, W * 0.0012) + 'px solid ' + b.border : '0') + ';' +
      'border-radius:' + (b.radius || 0) * W + 'px;justify-content:' + ({ l: 'flex-start', c: 'center', r: 'flex-end' }[b.align] || 'center') + ';padding:0 ' + W * 0.006 + 'px';
  },
  /** vẽ box lên canvas (bản in) */
  stamp(cv, b, text) {
    if (!b || !text) return;
    const c = cv.getContext('2d'), W = cv.width, H = cv.height;
    const x = b.x * W, y = b.y * H, w = b.w * W, h = b.h * H, r = Math.min((b.radius || 0) * W, h / 2, w / 2);
    const path = () => { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); };
    if (b.bg) { path(); c.fillStyle = b.bg; c.fill(); }
    if (b.border) { path(); c.lineWidth = Math.max(1, W * 0.0012); c.strokeStyle = b.border; c.stroke(); }
    c.font = (b.bold ? 'bold ' : '') + Math.max(5, b.size * W) + 'px ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif';
    c.fillStyle = b.color || '#333'; c.textBaseline = 'middle';
    c.textAlign = { l: 'left', c: 'center', r: 'right' }[b.align] || 'center';
    const pad = W * 0.006;
    c.fillText(text, b.align === 'l' ? x + pad : b.align === 'r' ? x + w - pad : x + w / 2, y + h / 2);
  },
  rgb(hex, L) { const n = parseInt(String(hex).slice(1), 16); return L.rgb((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255); },
  /** vẽ box vào một trang pdf-lib (y của PDF tính từ dưới lên) */
  pdf(page, b, text, fonts, L) {
    if (!b || !text) return;
    const { width: W, height: H } = page.getSize();
    const x = b.x * W, w = b.w * W, h = b.h * H, top = H - b.y * H, r = Math.min((b.radius || 0) * W, h / 2, w / 2);
    if (b.bg || b.border) {
      const o = { borderWidth: b.border ? Math.max(0.6, W * 0.0012) : 0 };
      if (b.bg) o.color = PNK.rgb(b.bg, L);
      if (b.border) o.borderColor = PNK.rgb(b.border, L);
      if (r > 0.5) page.drawSvgPath('M ' + r + ' 0 H ' + (w - r) + ' A ' + r + ' ' + r + ' 0 0 1 ' + w + ' ' + r + ' V ' + (h - r) + ' A ' + r + ' ' + r + ' 0 0 1 ' + (w - r) + ' ' + h +
        ' H ' + r + ' A ' + r + ' ' + r + ' 0 0 1 0 ' + (h - r) + ' V ' + r + ' A ' + r + ' ' + r + ' 0 0 1 ' + r + ' 0 Z', Object.assign({ x: x, y: top }, o));
      else page.drawRectangle(Object.assign({ x: x, y: top - h, width: w, height: h }, o));
    }
    const font = b.bold ? fonts.b : fonts.r, fs = Math.max(4, b.size * W), tw = font.widthOfTextAtSize(text, fs), pad = W * 0.006;
    const tx = b.align === 'l' ? x + pad : b.align === 'r' ? x + w - pad - tw : x + (w - tw) / 2;
    page.drawText(text, { x: tx, y: top - h / 2 - fs * 0.35, size: fs, font: font, color: PNK.rgb(b.color || '#333333', L) });
  }
};
</script>

<script>
'use strict';
const SHQ = new URLSearchParams(location.search), TOKEN = (SHQ.get('t') || (/^\/s\/([\w-]+)/.exec(location.pathname) || [])[1] || '').replace(/[^\w-]/g, '');

    .withSuccessHandler(r => r && r.ok ? res(r.data) : rej(Object.assign(new Error(r ? r.error : 'Máy chủ không phản hồi (' + fn + ') — tải lại trang để thử lại'), { code: r && r.code })))

}
function fmtSize(b) { b = Number(b) || 0; if (!b) return ''; const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return (b >= 100 || !i ? Math.round(b) : b.toFixed(1).replace('.', ',')) + ' ' + u[i]; }
function fmtDT(t) { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }

function fail(title, msg, icon) {

/* ══════════ NHIỀU TÀI LIỆU NỐI TIẾP NHƯ MỘT ══════════ */
const V = { L: null, docs: [], zoom: 1, main: null, obs: null, total: 0, cur: 0 };
const ZS = [0.5, 0.67, 0.8, 0.9, 1, 1.15, 1.3, 1.5, 1.75, 2, 2.5];

async function start() {
  let L;

  catch (e) { return fail(e.code === 'EXPIRED' ? 'Link đã hết hạn' : e.code === 'GONE' ? 'Link không còn hiệu lực' : 'Không mở được link', e.message, e.code === 'GONE' ? 'bi-link-45deg' : 'bi-hourglass-bottom'); }

    L.files.map((f, i) => '<button class="tc" data-i="' + i + '"><span class="no">' + (i + 1) + '</span><span class="tx"><b>' + esc(f.n) + '</b>' + (f.d ? '<small>' + esc(f.d) + '</small>' : '') + '</span><span class="st" id="st' + i + '"><span class="spin"></span></span></button>').join('') + '</aside>' +
    '<main class="sh-m" id="main">' + (L.note ? '<div class="sh-note sh-attn"><i class="bi bi-sticky-fill"></i><div><b>Cần chú ý</b><p>' + esc(L.note) + '</p></div></div>' : '') + (L.notice ? '<div class="sh-note"><i class="bi bi-info-circle"></i><div>' + esc(L.notice) + '</div></div>' : '') +
    L.files.map((f, i) => '<section class="sec" id="sec' + i + '"><div class="sec-t"><span class="no">' + (i + 1) + '</span><b title="' + esc(f.n) + '">' + esc(f.n) + '</b><small id="pc' + i + '">' + esc(fmtSize(f.s)) + '</small></div><div class="ph"></div></section>').join('') +
    '</main><div class="sh-pill" id="pill">Đang tải…</div>';
