    if (on.length) {
      try { localStorage.setItem('ktcm.prsel.' + TOKEN, JSON.stringify({ o: on.map(d => [d.f.id + '#' + d.i, 1]).concat(V.docs.filter(d => on.indexOf(d) < 0).map(d => [d.f.id + '#' + d.i, 0])) })); } catch (e) {}
      const bar = document.createElement('div'); bar.className = 'sh-note sh-sel';
      bar.innerHTML = '<i class="bi bi-printer"></i><div>Link in đã chọn sẵn <b>' + on.length + ' tệp</b> theo thứ tự cần in.</div><button class="btn sm" id="selEd"><i class="bi bi-ui-checks"></i><span class="bl">Xem / đổi</span></button>' +
        (L.pickDl ? '<button class="btn sm" id="selDl"><i class="bi bi-download"></i><span class="bl">Tải PDF</span></button>' : '') + '<button class="btn sm pri" id="selPr"><i class="bi bi-printer"></i>In ' + on.length + ' tệp</button>';
      V.main.insertBefore(bar, V.main.firstChild);
      bar.querySelector('#selPr').onclick = () => printAll(on);
      bar.querySelector('#selEd').onclick = printPick;
      const sd = bar.querySelector('#selDl'); if (sd) sd.onclick = () => download(on);
    }
  }
  V.obs = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) draw(en.target._p); }), { root: V.main, rootMargin: '900px 0px' });
  V.main.addEventListener('scroll', track, { passive: true });
  $('#toc').onclick = e => { const t = e.target.closest('[data-i]'); if (t) { jump(Number(t.dataset.i)); sh.classList.remove('toc'); } };
  $('#tocBtn').onclick = () => sh.classList.toggle('toc');
  $('#scrim').onclick = () => sh.classList.remove('toc');
  $('#acts').onclick = e => { const z = e.target.closest('[data-z]'); if (z) stepZoom(Number(z.dataset.z)); };
  $('#zv').onclick = () => setZoom(1);
  $('#dl').onclick = download;
  $('#pr').onclick = () => printAll();
  $('#prSel').onclick = printPick;
  // chặn chuột phải / giữ lâu để lưu ảnh trang (không tuyệt đối — chỉ ngăn thao tác lưu thông thường)
  V.main.addEventListener('contextmenu', e => { if (e.target.closest('.pg')) e.preventDefault(); });
  addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); if (L.print) (L.pickOnly ? printPick() : printAll()); else toast('Tài liệu này không cho phép in', 'info'); }
    if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); if (!L.download) toast('Tài liệu này không cho phép tải về', 'info'); else download(); }
  });
  addEventListener('resize', debounce(() => setZoom(V.zoom, true), 150));
  addEventListener('keydown', e => { if (e.target.closest('input')) return; if (e.key === '+' || e.key === '=') stepZoom(1); if (e.key === '-') stepZoom(-1); if (e.key === '0') setZoom(1); });
  track();
  for (const d of V.docs) await load(d);       // lần lượt theo thứ tự, tài liệu đầu hiện ngay
}
function debounce(fn, ms) { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }

function load(d) {
  if (d.p) return d.p;
  return (d.p = (async () => {
    d.state = 'load';
    const sec = $('#sec' + d.i), st = $('#st' + d.i);
    try {
      const r = await rpc('shareFile', { t: TOKEN, id: d.f.id });
      if (r.type !== 'pdf') throw Object.assign(new Error(r.type === 'big' ? 'Tài liệu quá lớn để xem trực tuyến (' + fmtSize(r.size) + ')' : 'Không xem được định dạng này'), { soft: 1 });
      const bytes = b64bytes(r.b64);
      if (V.L.download || V.L.pickDl) d.bytes = bytes.slice();
      const lib = await pdfReady();
      d.pdf = await lib.getDocument({ data: bytes }).promise;
      let n = d.pdf.numPages;
      const ph = $('.ph', sec);
      // chỉ các trang người tạo đã chọn (không chọn = cả tài liệu); k = số trang gốc, i = vị trí trong bản ghép
      const want = (d.f.p && d.f.p.length ? d.f.p : Array.from({ length: n }, (_, j) => j + 1)).filter(k => k >= 1 && k <= n);
      d.want = want;
      for (let j = 0; j < want.length; j++) {
        const k = want[j], page = await d.pdf.getPage(k), vp = page.getViewport({ scale: 1 });
        const el = document.createElement('div'); el.className = 'pg loading';
        el.innerHTML = '<span class="pn">' + (j + 1) + ' / ' + want.length + '</span>';
        const p = { d: d, k: k, i: j + 1, page: page, w: vp.width, h: vp.height, el: el, drawn: 0 };
        el._p = p; d.pages.push(p); size(p);
        if (j === 0) ph.replaceWith(el); else sec.appendChild(el);
        V.obs.observe(el);
      }
      const n0 = n; n = want.length;
      if (!n) ph.replaceWith(Object.assign(document.createElement('div'), { className: 'msg', textContent: 'Không có trang nào được chọn' }));
      d.state = 'ok';
      paintNums();
      st.textContent = n + ' tr'; $('#pc' + d.i).textContent = n + (n < n0 ? '/' + n0 : '') + ' trang' + (d.f.s ? ' · ' + fmtSize(d.f.s) : '');
    } catch (e) {
      d.state = 'err'; paintNums();
      st.innerHTML = '<i class="bi bi-exclamation-triangle" style="color:var(--warn)"></i>';
      const ph = $('.ph', sec); const m = document.createElement('div'); m.className = 'msg';
      m.innerHTML = '<i class="bi bi-exclamation-triangle"></i>' + esc(e.message) + (e.soft ? '' : '<div style="margin-top:10px"><button class="btn sm">Thử lại</button></div>');
      (ph || $('.msg', sec)).replaceWith(m);
      const btn = $('button', m); if (btn) btn.onclick = () => { m.replaceWith(Object.assign(document.createElement('div'), { className: 'ph' })); st.innerHTML = '<span class="spin"></span>'; d.p = null; load(d); };
    }
    track();
  })());
}
function size(p) {
  const w = Math.round(targetW() * V.zoom); p.el.style.width = w + 'px'; p.el.style.height = Math.round(w * p.h / p.w) + 'px';
  if (p.lab && V.box) p.lab.style.cssText = PNK.css(V.box, w);
}
/* ── đánh số trang trên bản ghép ── */
function pnText(d, k) {
  const pn = V.L.pnum || {}; if (!V.box) return null;
  const s0 = (Number(pn.start) >= 0 ? Number(pn.start) : 1) - 1;    // số bắt đầu (mặc định 1)
  let n = k, N = d.pages.length || '…';
  if (pn.scope !== 'doc') {
    let off = 0;
    for (const x of V.docs) { if (x === d) break; if (x.state === 'ok') off += x.pages.length; else if (x.state !== 'err') return '…'; }
    n = off + k;
    N = V.docs.every(x => x.state === 'ok' || x.state === 'err') ? V.docs.reduce((a, x) => a + x.pages.length, 0) : '…';
  }
  return PNK.text(pn.fmt, s0 + n, typeof N === 'number' ? s0 + N : N);
}
function paintNums() {
  if (!V.box) return;
  V.docs.forEach(d => d.pages.forEach(p => {
    if (!p.lab) { p.lab = document.createElement('span'); p.lab.className = 'pnl'; p.el.appendChild(p.lab); size(p); }
    p.lab.textContent = pnText(d, p.i) || '';
  }));
}
async function draw(p) {
  if (!p) return;
  const s = p.el.offsetWidth / p.w;
  if (Math.abs(p.drawn - s) < 1e-3 || p.busy) return;
  p.busy = true;
  const dpr = Math.min(2.5, (devicePixelRatio || 1) * 1.15), vp = p.page.getViewport({ scale: s * dpr });
  const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
  try { await p.page.render({ canvasContext: cv.getContext('2d', { alpha: false }), viewport: vp }).promise; } catch (e) { p.busy = false; return; }
  const old = p.el.querySelector('canvas'); if (old) old.replaceWith(cv); else p.el.insertBefore(cv, p.el.firstChild);
  p.el.classList.remove('loading'); p.drawn = s; p.busy = false;
  if (Math.abs(p.el.offsetWidth / p.w - s) > 1e-3) draw(p);   // tỉ lệ đổi trong lúc vẽ
}
function allPages() { return V.docs.reduce((a, d) => a.concat(d.pages), []); }
function track() {
  if (V._raf) return;
  V._raf = requestAnimationFrame(() => {
    V._raf = 0;
    const mid = V.main.getBoundingClientRect().top + V.main.clientHeight * 0.35;
    let di = 0;
    V.docs.forEach(d => { const s = $('#sec' + d.i); if (s && s.getBoundingClientRect().top <= mid) di = d.i; });
    const pages = allPages(); let g = 0, cur = 0;
    pages.forEach(p => { g++; if (p.el.getBoundingClientRect().top <= mid) cur = g; });
    const loading = V.docs.some(d => d.state === 'wait' || d.state === 'load');
    $('#pill').textContent = 'Tài liệu ' + (di + 1) + '/' + V.docs.length + (pages.length ? ' · trang ' + Math.max(1, cur) + '/' + pages.length + (loading ? '+' : '') : '');
    if (di !== V.cur || !$('.tc.on')) { V.cur = di; document.querySelectorAll('.tc').forEach((t, i) => t.classList.toggle('on', i === di)); const t = $('.tc.on'); if (t) t.scrollIntoView({ block: 'nearest' }); }
  });
}
function jump(i) { const d = V.docs[i]; load(d); V.main.scrollTop = $('#sec' + i).offsetTop - 10; }
function setZoom(z, keep) {
  const pages = allPages();
  const mid = V.main.scrollTop + 40;
  const anchor = pages.find(p => p.el.offsetTop + p.el.offsetHeight > mid);
  const off = anchor ? (mid - anchor.el.offsetTop) / Math.max(1, anchor.el.offsetHeight) : 0;
  V.zoom = z; $('#zv').textContent = z === 1 ? 'Vừa' : Math.round(z * 100) + '%';
  pages.forEach(size);
  if (anchor) V.main.scrollTop = anchor.el.offsetTop + off * anchor.el.offsetHeight - 40;
  const hr = V.main.getBoundingClientRect();
  pages.forEach(p => { const r = p.el.getBoundingClientRect(); if (r.bottom > hr.top - 900 && r.top < hr.bottom + 900) draw(p); });
}
function stepZoom(dir) { let i = ZS.findIndex(z => z >= V.zoom - 1e-3); if (i < 0) i = ZS.length - 1; i = Math.max(0, Math.min(ZS.length - 1, ZS[i] > V.zoom + 1e-3 && dir > 0 ? i : i + dir)); setZoom(ZS[i]); }

/* ── in: vẽ mọi trang thành ảnh (~150 dpi) rồi mở hộp thoại in của trình duyệt ── */
async function printAll(list) {
  const docs = Array.isArray(list) && list.length ? list : V.docs;     // Ghép file in: chỉ các tệp đã chọn, đúng thứ tự đã xếp
  const btn = $('#pr'); if (btn.disabled) return;
  btn.disabled = true; btn.classList.add('busy');
  let area = $('#printArea');
  try {
    toast('Đang chuẩn bị bản in ' + docs.length + ' tài liệu…', 'info');
    await Promise.all(docs.map(load));
    if (area) area.remove();
    area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area);
    const sizes = {}, css = [];
    let n = 0;
    for (const d of docs) for (const p of d.pages) {
      // khổ trang gốc (pt) → một @page có tên cho mỗi khổ khác nhau: A4 dọc, A4 ngang, Letter… đều in đúng khổ
      const v1 = p.page.getViewport({ scale: 1 }), W = Math.round(v1.width * 100) / 100, H = Math.round(v1.height * 100) / 100, key = W + 'x' + H;
      if (!sizes[key]) { sizes[key] = 'ps' + Object.keys(sizes).length; css.push('@page ' + sizes[key] + '{ size:' + W + 'pt ' + H + 'pt; margin:0 }'); }
      const vp = p.page.getViewport({ scale: 200 / 72 });
      const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
      await p.page.render({ canvasContext: cv.getContext('2d', { alpha: false }), viewport: vp }).promise;
      PNK.stamp(cv, V.box, pnText(d, p.i));
      const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.9));
      const box = document.createElement('div'); box.className = 'pp';
      box.style.cssText = 'page:' + sizes[key] + ';width:' + W + 'pt;height:' + (H - 0.6) + 'pt';   // thấp hơn 0,6pt để làm tròn không đẩy sang tờ mới
      const img = new Image(); img.src = URL.createObjectURL(blob); box.appendChild(img); area.appendChild(box);
      await img.decode().catch(() => {});
      n++;
    }
    if (!n) throw new Error('Chưa có trang nào để in');
    let st = $('#printPages'); if (!st) { st = document.createElement('style'); st.id = 'printPages'; document.head.appendChild(st); }
    st.textContent = '@media print{' + css.join('') + '}';
    const clean = () => { const a = $('#printArea'); if (a) { a.querySelectorAll('img').forEach(i => URL.revokeObjectURL(i.src)); a.remove(); } removeEventListener('afterprint', clean); };
    addEventListener('afterprint', clean);
    window.print();
  } catch (e) { toast(e.message || String(e), 'err', 6000); }
  finally { download.run = false; btn.disabled = false; btn.classList.remove('busy'); }
}

/* ── Ghép file in: tích tệp cần in (bỏ tích = chỉ xem), kéo / bấm mũi tên để đổi thứ tự in; nhớ lựa chọn trên máy này ── */
function printPick() {
  const key = 'ktcm.prsel.' + TOKEN;
  let saved = null; try { saved = JSON.parse(localStorage.getItem(key)); } catch (e) {}
  let order = V.docs.map(d => ({ d: d, on: true }));
  if (saved && Array.isArray(saved.o)) { const by = {}; order.forEach(o => { by[o.d.f.id + '#' + o.d.i] = o; }); const re = []; saved.o.forEach(k => { if (by[k[0]]) { by[k[0]].on = !!k[1]; re.push(by[k[0]]); delete by[k[0]]; } }); order = re.concat(Object.values(by)); }
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal pk-m" role="dialog" aria-modal="true"><div class="modal-h"><h3><i class="bi bi-printer"></i>Chọn tệp để in</h3><button class="ibtn x" data-x aria-label="Đóng"><i class="bi bi-x-lg"></i></button></div>' +
    '<div class="modal-b"><div class="pk-hint">Tích các tệp <b>cần in</b> · bỏ tích = chỉ xem, không in · kéo <i class="bi bi-grip-vertical"></i> hoặc dùng mũi tên để đổi thứ tự in.</div><div class="pk-l" id="pkL"></div></div>' +
    '<div class="modal-f pk-f"><button class="btn ghost sm" id="pkAll" title="Chọn tất cả" aria-label="Chọn tất cả"><i class="bi bi-check2-all"></i><span>Chọn tất cả</span></button><span style="flex:1"></span><button class="btn ghost pk-x" data-x>Huỷ</button><button class="btn" id="pkLk" aria-label="Link in" title="Sao chép link mở sẵn đúng các tệp & thứ tự này — gửi cho máy khác in"><i class="bi bi-link-45deg"></i><span>Link in</span></button>' + (V.L.pickDl ? '<button class="btn" id="pkDl" title="Tải PDF đã ghép" aria-label="Tải PDF"><i class="bi bi-download"></i><span>Tải PDF</span></button>' : '') + '<button class="btn pri" id="pkGo"><i class="bi bi-printer"></i><span>In</span></button></div></div>';
  document.body.appendChild(bg);
  const L = bg.querySelector('#pkL'), go = bg.querySelector('#pkGo');
  let drag = -1;
  const paint = () => {
    const n = order.filter(o => o.on).length;
    L.innerHTML = order.map((o, i) => '<div class="pk-r' + (o.on ? ' on' : '') + '" draggable="true" data-i="' + i + '"><i class="bi bi-grip-vertical pk-h"></i><label><input type="checkbox" data-c="' + i + '"' + (o.on ? ' checked' : '') + '><span class="pk-no">' + (o.on ? order.slice(0, i + 1).filter(x => x.on).length : '–') + '</span>' +
      '<span class="pk-t"><b title="' + esc(o.d.f.n) + '">' + esc(o.d.f.n) + '</b><small>' + (o.on ? 'In' : 'Chỉ xem') + (o.d.pages.length ? ' · ' + o.d.pages.length + ' trang' : '') + '</small></span></label>' +
      '<button class="ibtn" data-m="' + i + '" data-d="-1" aria-label="Lên"' + (i ? '' : ' disabled') + '><i class="bi bi-arrow-up"></i></button><button class="ibtn" data-m="' + i + '" data-d="1" aria-label="Xuống"' + (i < order.length - 1 ? '' : ' disabled') + '><i class="bi bi-arrow-down"></i></button></div>').join('');
    go.querySelector('span').textContent = n ? 'In ' + n + ' tệp' : 'Chưa chọn tệp';
    go.disabled = !n;
    const lk = bg.querySelector('#pkLk'); if (lk) lk.disabled = !n;
    const dl = bg.querySelector('#pkDl'); if (dl) { dl.disabled = !n; dl.querySelector('span').textContent = n ? 'Tải PDF ' + n + ' tệp' : 'Tải PDF'; }
  };
  const save = () => { try { localStorage.setItem(key, JSON.stringify({ o: order.map(o => [o.d.f.id + '#' + o.d.i, o.on ? 1 : 0]) })); } catch (e) {} };
  const close = () => bg.remove();
  bg.addEventListener('click', e => {
    if (e.target.closest('[data-x]') || e.target === bg) return close();
    const m = e.target.closest('[data-m]'); if (m) { const i = Number(m.dataset.m), j = i + Number(m.dataset.d); const t = order[i]; order[i] = order[j]; order[j] = t; save(); return paint(); }
    if (e.target.closest('#pkAll')) { order.forEach(o => { o.on = true; }); save(); return paint(); }
    if (e.target.closest('#pkGo')) { save(); const list = order.filter(o => o.on).map(o => o.d); close(); printAll(list); }
    if (e.target.closest('#pkLk')) { save(); const on = order.filter(o => o.on).map(o => o.d.i); shareLink(BASE + TOKEN + (BASE.indexOf('?') >= 0 ? '&' : '?') + 'o=' + on.join(','), on.length); return; }
    if (e.target.closest('#pkDl')) { save(); const list = order.filter(o => o.on).map(o => o.d); close(); download(list); }
  });
  bg.addEventListener('change', e => { const c = e.target.dataset.c; if (c != null) { order[Number(c)].on = e.target.checked; save(); paint(); } });
  L.addEventListener('dragstart', e => { const r = e.target.closest('.pk-r'); if (r) { drag = Number(r.dataset.i); r.classList.add('drag'); } });
  L.addEventListener('dragover', e => { if (drag >= 0 && e.target.closest('.pk-r')) e.preventDefault(); });
  L.addEventListener('drop', e => { const r = e.target.closest('.pk-r'); if (drag < 0 || !r) return; e.preventDefault(); const to = Number(r.dataset.i), x = order.splice(drag, 1)[0]; order.splice(to, 0, x); drag = -1; save(); paint(); });
  L.addEventListener('dragend', () => { drag = -1; paint(); });
  paint();
}

/* ── "Link in": gửi nhanh cho máy khác (điện thoại: bảng chia sẻ; máy tính: sao chép) ── */
async function shareLink(url, n) {
  const title = V.L.name + ' — in ' + n + ' tệp';
  if (navigator.share && matchMedia('(pointer:coarse)').matches) { try { await navigator.share({ title: title, url: url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = url; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (x) {} ta.remove();
  }
  if (ok) toast('Đã sao chép link in ' + n + ' tệp — mở trên máy khác là chọn sẵn đúng tệp & thứ tự để in', 'ok', 5000);
  else prompt('Sao chép link in này:', url);
}

/* ── tải một PDF đã ghép (ghép ngay trên máy người xem bằng pdf-lib) ── */
function script(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Không tải được thư viện ghép PDF')); document.head.appendChild(s); }); }
async function download(list) {
  const docs = Array.isArray(list) ? list : V.docs;     // từ "Ghép file in": đúng các tệp đã chọn, đúng thứ tự
  const btn = $('#dl'); if (download.run) return;
  download.run = true; btn.disabled = true; btn.classList.add('busy');
  try {
    toast('Đang chuẩn bị bản ghép ' + docs.length + ' tài liệu…', 'info');
    await Promise.all(docs.map(load));
    if (!window.PDFLib) await script('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js');
    const out = await PDFLib.PDFDocument.create();
    const fonts = V.box ? { r: await out.embedFont(PDFLib.StandardFonts.Helvetica), b: await out.embedFont(PDFLib.StandardFonts.HelveticaBold) } : null;
    let skipped = 0;
    for (const d of docs) {
      if (!d.bytes) { skipped++; continue; }
      const src = await PDFLib.PDFDocument.load(d.bytes, { ignoreEncryption: true });
      (await out.copyPages(src, (d.want || src.getPageIndices().map(x => x + 1)).filter(k => k <= src.getPageCount()).map(k => k - 1))).forEach((p, i) => {
        out.addPage(p);
        if (fonts) PNK.pdf(p, V.box, pnText(d, i + 1), fonts, PDFLib);
      });
    }
    out.setTitle(V.L.name);
    const blob = new Blob([await out.save()], { type: 'application/pdf' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = V.L.name.replace(/[\\/:*?"<>|]+/g, '-').slice(0, 120) + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast(skipped ? 'Đã tải — bỏ qua ' + skipped + ' tài liệu không mở được' : 'Đã tải bản PDF ghép (' + fmtSize(blob.size) + ')', skipped ? 'info' : 'ok');
  } catch (e) { toast(e.message || String(e), 'err', 6000); }
  finally { btn.disabled = false; btn.classList.remove('busy'); }
}
start();
</script>
