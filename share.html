*, *::before, *::after{ box-sizing:border-box; margin:0; padding:0 }

/* ══════════════════════════════════════════════════════════════
   DESIGN TOKENS — cùng hệ với HTL Docs / Film Tracking (density 8);
   thang màu Kiến Trẻ: xanh chàm oklch(0.424 0.199 265.6), nền oklch(0.972 0.012 250.4), chữ ui-sans-serif
   ══════════════════════════════════════════════════════════════ */
:root{
  --sab:env(safe-area-inset-bottom, 0px);   /* vùng thanh Home — trong trang vỏ (khung) do trang vỏ đo rồi gửi vào */
  /* Kiến Trẻ: primary = color.text.inverse oklch(0.424 0.199 265.638) */
  --brand-950:oklch(0.22 0.09 263); --brand-900:oklch(0.29 0.13 264); --brand-800:oklch(0.36 0.17 265);
  --brand-700:oklch(0.424 0.199 265.638); --brand-600:oklch(0.5 0.2 265); --brand-500:oklch(0.58 0.18 264); --brand-400:oklch(0.72 0.12 260);
  --brand-100:oklch(0.93 0.035 260); --brand-50:oklch(0.97 0.014 254.604);

  --primary:var(--brand-700); --on-primary:#FFFFFF;
  --accent:oklch(0.5 0.2 265); --accent-soft:oklch(0.86 0.08 245); --orange:oklch(0.62 0.2 35);
  --bg:oklch(0.972 0.012 250.4); --surface:oklch(1 0 0); --surface-2:oklch(0.985 0.006 250.4); --surface-3:oklch(0.97 0.014 254.604);
  --border:oklch(0.928 0.006 264.531); --border-strong:oklch(0.88 0.02 250.4);
  --ink:oklch(0.145 0 0); --ink-2:oklch(0.373 0.034 259.733); --muted:oklch(0.5 0.03 250.4);
  --ok:#0F7B45; --warn:#A96606; --danger:#C4262B; --info:#1D4ED8; --violet:#6D28D9;
  --ring:oklch(0.5 0.2 265 / .30);

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --r-s:8px; --r-m:10px; --r-l:12px;   /* radius.xs = 12px; nút dạng viên thuốc */
  --sh-1:0 1px 3px 0 oklch(0.346 0.124 250.4 / .12), 0 1px 2px 0 oklch(0.346 0.124 250.4 / .08);
  --sh-2:0 4px 12px oklch(0.346 0.124 250.4 / .10), 0 1px 3px 0 rgba(0,0,0,.1);
  --sh-3:0 14px 34px rgba(31,45,71,.13), 0 4px 12px rgba(31,45,71,.07);
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-sans:ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';

  --t-fast:150ms; /* motion.duration.instant */ --t-base:240ms; --t-slow:400ms;
  --ease:cubic-bezier(.4,0,.2,1); --spring:cubic-bezier(.34,1.42,.5,1);

  --sb-w:238px; --sb-w-min:72px; --tb-h:58px;
  --sb-bg:linear-gradient(170deg, var(--brand-950) 0%, var(--brand-900) 46%, var(--brand-800) 100%);
  --sb-glow:radial-gradient(circle 280px at 100% 0%, oklch(0.72 0.12 245 / .22) 0%, transparent 62%),
            radial-gradient(circle 240px at 0% 100%, oklch(0.6 0.18 280 / .16) 0%, transparent 60%);
  --sb-ink:#FFFFFF; --sb-ink-2:rgba(255,255,255,.74); --sb-ink-3:rgba(255,255,255,.5);
  --sb-sec:rgba(255,255,255,.34); --sb-line:rgba(255,255,255,.08); --sb-hover:rgba(255,255,255,.07);
  --sb-pill:rgba(255,255,255,.15);
  --sb-pill-sh:inset 0 1px 0 rgba(255,255,255,.26), 0 6px 16px rgba(0,0,0,.22);
  --sb-accent:var(--accent-soft);

}

html,body{ height:100% }
body{
  font-family:var(--font-sans);
  font-size:13px; line-height:1.5; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button, input, select, textarea{ font:inherit; color:inherit }
a{ color:var(--brand-700) }
.num, table{ font-variant-numeric:tabular-nums }
.mono{ font-family:var(--font-mono) }
[hidden]{ display:none !important }

::-webkit-scrollbar{ width:11px; height:11px }
::-webkit-scrollbar-track{ background:transparent }
::-webkit-scrollbar-thumb{ background:#BFCADA; border-radius:9px; border:3px solid transparent; background-clip:padding-box }
::-webkit-scrollbar-thumb:hover{ background:#9DAABE; background-clip:padding-box }
:focus-visible{ outline:2px solid var(--brand-600); outline-offset:2px; border-radius:4px }
.sb :focus-visible{ outline-color:var(--accent-soft) }
@keyframes spin{ to{ transform:rotate(360deg) } }

/* ══════════ MÀN HÌNH TẢI ══════════ */
#ov{
  position:fixed; inset:0; z-index:900; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--sp-4);
  background:radial-gradient(120% 90% at 50% 34%, var(--brand-800) 0%, var(--brand-950) 52%, #08090C 100%);
  transition:opacity var(--t-slow) var(--ease), transform var(--t-slow) var(--ease), visibility var(--t-slow); overflow:hidden;
}
#ov::before, #ov::after{
  content:''; position:absolute; width:56vmax; height:56vmax; border-radius:50%; filter:blur(70px); opacity:.30; pointer-events:none;
  background:radial-gradient(circle, var(--brand-500) 0%, transparent 68%); animation:ovDrift 14s ease-in-out infinite alternate;
}
#ov::after{ background:radial-gradient(circle, var(--brand-600) 0%, transparent 68%); animation-duration:19s; animation-direction:alternate-reverse; opacity:.22 }
@keyframes ovDrift{ from{ transform:translate(-22%,-18%) scale(.92) } to{ transform:translate(20%,16%) scale(1.08) } }
#ov.out{ opacity:0; transform:scale(1.05); visibility:hidden }
.ov-grid{ position:absolute; inset:-2px; pointer-events:none; opacity:.16;
  background-image:linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px);
  background-size:44px 44px; -webkit-mask:radial-gradient(60% 55% at 50% 45%, #000 0%, transparent 75%); mask:radial-gradient(60% 55% at 50% 45%, #000 0%, transparent 75%);
  animation:ovGrid 18s linear infinite }
@keyframes ovGrid{ to{ background-position:44px 44px, 44px 44px } }
.ov-stage{ position:relative; width:170px; height:150px; z-index:1; margin-bottom:4px }
.ov-doc{ position:absolute; left:50%; top:50%; width:78px; height:100px; margin:-50px 0 0 -39px; border-radius:10px;
  background:linear-gradient(180deg,#fff,#EEF1F8); box-shadow:0 18px 40px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.6) }
.ov-doc.d3{ opacity:.35; animation:ovFan3 3.2s var(--ease) infinite }
.ov-doc.d2{ opacity:.6; animation:ovFan2 3.2s var(--ease) infinite }
.ov-doc.d1{ animation:ovFloat 3.2s ease-in-out infinite; overflow:hidden }
@keyframes ovFan3{ 0%,100%{ transform:rotate(-4deg) translate(-4px,4px) } 45%,70%{ transform:rotate(-16deg) translate(-26px,6px) } }
@keyframes ovFan2{ 0%,100%{ transform:rotate(3deg) translate(3px,3px) } 45%,70%{ transform:rotate(12deg) translate(24px,4px) } }
@keyframes ovFloat{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) } }
.ov-doc i.h, .ov-doc i.l{ position:absolute; left:12px; height:6px; border-radius:3px; background:var(--brand-600); transform-origin:left; animation:ovType 3.2s var(--ease) infinite }
.ov-doc i.h{ top:14px; width:34px; height:8px; background:var(--brand-800) }
.ov-doc i.l{ background:#C7CEDB; width:54px }
.ov-doc i.l1{ top:32px; animation-delay:.15s } .ov-doc i.l2{ top:44px; width:46px; animation-delay:.3s }
.ov-doc i.l3{ top:56px; width:52px; animation-delay:.45s } .ov-doc i.l4{ top:68px; width:30px; animation-delay:.6s }
@keyframes ovType{ 0%,8%{ transform:scaleX(0) } 30%,85%{ transform:scaleX(1) } 100%{ transform:scaleX(0) } }
.ov-stamp{ position:absolute; right:8px; bottom:8px; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:15px;
  background:#16A34A; box-shadow:0 4px 10px rgba(22,163,74,.45); animation:ovStamp 3.2s var(--spring) infinite }
@keyframes ovStamp{ 0%,48%{ transform:scale(0) rotate(-40deg); opacity:0 } 60%,88%{ transform:scale(1) rotate(0); opacity:1 } 100%{ transform:scale(.6); opacity:0 } }
.ov-orbit{ position:absolute; inset:-8px; border-radius:50%; border:1px dashed rgba(255,255,255,.18); animation:spin 9s linear infinite }
.ov-orbit b{ position:absolute; width:8px; height:8px; border-radius:50%; background:#fff; box-shadow:0 0 12px 3px color-mix(in srgb, var(--brand-400) 80%, transparent) }
.ov-orbit b:nth-child(1){ top:-4px; left:50%; margin-left:-4px }
.ov-orbit b:nth-child(2){ bottom:18%; right:2%; width:6px; height:6px; opacity:.7 }
.ov-orbit b:nth-child(3){ bottom:12%; left:6%; width:5px; height:5px; opacity:.5 }
.ov-t{ z-index:1; color:#fff; font-size:19px; font-weight:800; letter-spacing:.2px; text-align:center; padding:0 20px; animation:ovUp .7s var(--ease) both .1s }
.ov-t .k{ padding:2px 9px; margin-right:4px; border-radius:8px; white-space:nowrap; display:inline-block; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); letter-spacing:1.5px }
.ov-t .w{ background:linear-gradient(90deg,#fff 0%,#fff 40%,var(--brand-400) 50%,#fff 60%,#fff 100%); background-size:250% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent; animation:ovShine 3.2s linear infinite }
@keyframes ovShine{ from{ background-position:100% 0 } to{ background-position:-150% 0 } }
@keyframes ovUp{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
.ov-bar{ z-index:1; width:220px; height:4px; border-radius:4px; background:rgba(255,255,255,.14); overflow:hidden; animation:ovUp .7s var(--ease) both .2s }
.ov-bar i{ display:block; height:100%; width:12%; border-radius:4px; background:linear-gradient(90deg,var(--brand-400),#fff); transition:width .6s var(--ease); box-shadow:0 0 12px rgba(255,255,255,.6) }
.ov-s{ z-index:1; color:rgba(255,255,255,.72); font-size:12px; min-height:16px; animation:ovUp .7s var(--ease) both .3s }
@media (prefers-reduced-motion:reduce){ #ov *, #ov::before, #ov::after{ animation-duration:6s !important } }

/* ══════════ KHUNG ỨNG DỤNG ══════════ */
.app{ display:flex; height:100vh; overflow:hidden }
.app.enter .sb{ animation:sbIn 520ms var(--ease) both }
.app.enter .main{ animation:mainIn 520ms 60ms var(--ease) both }
@keyframes sbIn{ from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:none} }
@keyframes mainIn{ from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

.sb{ width:var(--sb-w); flex-shrink:0; display:flex; flex-direction:column; position:relative; z-index:60; background:var(--sb-bg);
     box-shadow:1px 0 0 rgba(255,255,255,.06), 3px 0 18px rgba(20,10,10,.16); transition:width var(--t-base) var(--ease), transform var(--t-base) var(--ease) }
.sb::after{ content:''; position:absolute; inset:0; pointer-events:none; background:var(--sb-glow) }
.app.mini .sb{ width:var(--sb-w-min) }
.sb-brand{ display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3); min-height:var(--tb-h); border-bottom:1px solid var(--sb-line); position:relative; z-index:1; cursor:pointer }
.sb-logo{ width:36px; height:36px; flex-shrink:0; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; color:#E6ECFF;
  background:linear-gradient(150deg, rgba(255,255,255,.22), rgba(255,255,255,.06)); border:1px solid rgba(255,255,255,.22); box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform var(--t-slow) var(--spring) }
.sb-brand:hover .sb-logo{ transform:rotate(-7deg) scale(1.05) }
.sb-name{ min-width:0; overflow:hidden }
.sb-n1{ font-size:12.5px; font-weight:800; color:var(--sb-ink); letter-spacing:.4px; white-space:nowrap; line-height:1.2 }
.sb-n2{ font-size:10px; color:var(--sb-ink-3); white-space:nowrap; margin-top:2px; letter-spacing:.3px }
.app.mini .sb-name{ display:none }

.sb-nav{ flex:1; overflow-y:auto; overflow-x:hidden; padding:var(--sp-3) 10px; position:relative; z-index:1 }
.sb-nav::-webkit-scrollbar{ width:0 }
.sb-sec{ font-size:9.5px; font-weight:800; letter-spacing:1.3px; text-transform:uppercase; color:var(--sb-sec); padding:10px 10px 8px; white-space:nowrap }
.app.mini .sb-sec{ font-size:0; text-align:center; padding:8px 0 }
.app.mini .sb-sec::after{ content:'•••'; font-size:9px; letter-spacing:1px; color:var(--sb-sec) }
.nav-mark{ position:absolute; top:0; left:10px; right:10px; height:42px; border-radius:999px; z-index:0; opacity:0; background:var(--sb-pill); box-shadow:var(--sb-pill-sh);
  transition:transform 380ms var(--spring), opacity var(--t-base) }
.app.mini .nav-mark{ left:8px; right:8px; border-radius:18px }
.nav-i{ position:relative; z-index:1; display:flex; align-items:center; gap:var(--sp-3); width:100%; min-height:42px; padding:10px var(--sp-3); margin-bottom:var(--sp-1);
  border:0; background:transparent; color:var(--sb-ink-2); font-size:12.5px; font-weight:600; cursor:pointer; border-radius:999px; text-align:left; text-decoration:none;
  transition:color var(--t-base) var(--ease), background var(--t-base) var(--ease) }
.nav-i i{ font-size:16px; width:20px; text-align:center; flex-shrink:0; transition:transform var(--t-slow) var(--spring), color var(--t-base) }
.nav-t{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.nav-i:hover{ color:var(--sb-ink); background:var(--sb-hover) }
.nav-i:hover i{ transform:scale(1.12) }
.nav-i[aria-current="page"]{ color:var(--sb-ink); font-weight:700; background:transparent }
.nav-i[aria-current="page"] i{ color:var(--sb-accent) }
.nav-badge{ min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--accent-soft); color:#3A2500; font-size:10.5px; font-weight:800; display:grid; place-items:center }
.app.mini .nav-i{ justify-content:center; padding:11px 0 }
.app.mini .nav-t{ display:none }
.app.mini .nav-badge{ position:absolute; top:3px; right:6px; min-width:16px; height:16px; font-size:9px; padding:0 4px }

.sb-foot{ padding:10px; border-top:1px solid var(--sb-line); position:relative; z-index:1 }
.sb-user{ display:flex; align-items:center; gap:var(--sp-2); padding:6px 8px; border-radius:999px; background:rgba(0,0,0,.24); border:1px solid rgba(255,255,255,.09); margin-bottom:var(--sp-2); overflow:hidden }
.av{ width:28px; height:28px; border-radius:50%; flex-shrink:0; display:grid; place-items:center; font-size:11px; font-weight:800; color:#fff; background:linear-gradient(135deg,var(--brand-600),var(--accent)) }
.av.sm{ width:22px; height:22px; font-size:9.5px }
.sb-user-t{ min-width:0 }
.sb-user-1{ font-size:11px; font-weight:700; color:var(--sb-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.sb-user-2{ font-size:9.5px; color:var(--sb-ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.app.mini .sb-user{ justify-content:center; padding:6px 0 }
.app.mini .sb-user-t{ display:none }
.sb-btn{ width:100%; min-height:32px; display:flex; align-items:center; justify-content:center; gap:7px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06);
  color:rgba(255,255,255,.82); border-radius:999px; font-size:11px; font-weight:700; cursor:pointer; transition:background var(--t-fast) }
.sb-btn:hover{ background:rgba(255,255,255,.15); color:#fff }
.sb-btn i{ transition:transform var(--t-slow) var(--spring) }
.app.mini .sb-btn span{ display:none }
.app.mini #btnMini i{ transform:rotate(180deg) }
.sb-scrim{ display:none }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; overflow:hidden }
.tb{ position:relative; height:var(--tb-h); flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:var(--sp-4); padding:0 var(--sp-4); box-shadow:var(--sh-1); z-index:150 }
.tb-burger{ display:none; width:36px; height:36px; border-radius:var(--r-m); border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2); font-size:17px; cursor:pointer; align-items:center; justify-content:center }
.tb-title{ min-width:0 }
.crumb{ font-size:10px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:6px; white-space:nowrap }
.crumb a{ color:inherit; text-decoration:none; cursor:pointer } .crumb a:hover{ color:var(--brand-700) }
.crumb i{ font-size:9px; opacity:.6 }
.crumb[hidden]{ display:none !important }      /* đường dẫn chỉ còn tên ứng dụng (đã ở thanh bên) → ẩn hẳn */
.tb-t1{ font-size:15px; font-weight:800; color:var(--ink); letter-spacing:-.1px; line-height:1.25; display:flex; align-items:center; gap:var(--sp-2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.tb-t1 > i{ color:var(--brand-600); font-size:16px }
.tb-title.swap .crumb, .tb-title.swap .tb-t1{ animation:titleIn 380ms var(--ease) both }
.tb-title.swap .tb-t1{ animation-delay:50ms }
@keyframes titleIn{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.tb-right{ margin-left:auto; display:flex; align-items:center; gap:var(--sp-2); flex-shrink:0 }
.sync-bar{ height:2px; flex-shrink:0; visibility:hidden; background:linear-gradient(90deg,transparent,var(--brand-600) 40%,var(--accent-soft) 60%,transparent); background-size:200% 100%; animation:sweep 1.3s linear infinite }
.sync-bar.on{ visibility:visible }
@keyframes sweep{ from{background-position:-100% 0} to{background-position:200% 0} }

.view{ flex:1; min-height:0; overflow:auto; padding:var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-3) }
.view > *{ flex-shrink:0 }
.view.va > *{ animation:viewIn 220ms var(--ease) both }
.view.va > *:nth-child(2){ animation-delay:40ms } .view.va > *:nth-child(3){ animation-delay:80ms } .view.va > *:nth-child(n+4){ animation-delay:110ms }
@keyframes viewIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@media (prefers-reduced-motion:reduce){ .view.va > *{ animation:none !important } }

/* ══════════ THÀNH PHẦN CHUNG ══════════ */
.chip{ display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 var(--sp-3); border-radius:20px; background:var(--surface-2); border:1px solid var(--border); font-size:11px; font-weight:600; color:var(--ink-2); white-space:nowrap }
.chip i{ font-size:11.5px; color:var(--muted) }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); flex-shrink:0 }
.dot.warn{ background:var(--warn) } .dot.err{ background:var(--danger) }
.dot.spin{ background:transparent; border:2px solid var(--warn); border-top-color:transparent; animation:spin .8s linear infinite }

.btn{ height:34px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 var(--sp-4); border-radius:999px; border:1px solid var(--border-strong);
  background:var(--surface-2); font-size:12px; font-weight:700; color:var(--ink-2); cursor:pointer; white-space:nowrap; transition:var(--t-base) var(--ease); text-decoration:none }
.btn:hover{ border-color:#A8B5C7; background:#fff; color:var(--ink); transform:translateY(-1px) }
.btn:active{ transform:scale(.97) }
.btn:disabled{ opacity:.5; pointer-events:none }
.btn i{ font-size:13px }
.btn.sm{ height:28px; font-size:11px; padding:0 10px }
.btn.xs{ height:24px; font-size:10.5px; padding:0 8px; border-radius:5px }
.btn.pri{ position:relative; overflow:hidden; border:0; border-radius:20px; padding:0 var(--sp-4); color:#fff;
  background:linear-gradient(135deg, var(--brand-800), var(--brand-600)); box-shadow:0 2px 9px color-mix(in srgb, var(--brand-700) 32%, transparent) }
.btn.pri::after{ content:''; position:absolute; top:0; bottom:0; left:-60%; width:40%; transform:skewX(-20deg); background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent); transition:left 560ms var(--ease) }
.btn.pri:hover{ color:#fff; box-shadow:0 7px 18px color-mix(in srgb, var(--brand-700) 38%, transparent); filter:brightness(1.05) }
.btn.pri:hover::after{ left:130% }
.btn.ok{ border:0; border-radius:20px; color:#fff; background:linear-gradient(135deg,#0B5E35,#12924F); box-shadow:0 2px 9px rgba(15,123,69,.3) }
.btn.ok:hover{ color:#fff; filter:brightness(1.05) }
.btn.red{ background:var(--brand-50); border-color:var(--brand-100); color:var(--brand-700) }
.btn.red:hover{ background:var(--brand-100); border-color:var(--brand-400) }
.btn.ghost{ background:transparent; border-color:transparent }
.btn.ghost:hover{ background:var(--surface-3); border-color:transparent }
.btn.busy i{ animation:spin .9s linear infinite }
.btn.busy i::before{ content:"\F130" }
.ibtn{ width:30px; height:30px; display:inline-grid; place-items:center; border-radius:var(--r-s); border:1px solid transparent; background:transparent; color:var(--muted); cursor:pointer; transition:var(--t-fast) }
.ibtn:hover{ background:var(--surface-3); color:var(--ink) }
.ibtn.danger:hover{ background:var(--brand-50); color:var(--danger) }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-l); box-shadow:var(--sh-1) }
.card-h{ display:flex; align-items:center; gap:var(--sp-2); padding:12px var(--sp-4); border-bottom:1px solid var(--border) }
.card-h h2, .card-h h3{ font-size:13px; font-weight:800; display:flex; align-items:center; gap:8px }
.card-h h2 i, .card-h h3 i{ color:var(--brand-600) }
.card-h .sp{ flex:1 }
.card-b{ padding:var(--sp-4) }
.card-b.p0{ padding:0 }
.muted{ color:var(--muted) }
.small{ font-size:11.5px }
.empty{ padding:36px 16px; text-align:center; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:8px }
.empty > i{ font-size:30px; color:var(--border-strong) }
.empty .btn{ margin-top:4px }

.grid{ display:grid; gap:var(--sp-3) }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)) } .g3{ grid-template-columns:repeat(3,minmax(0,1fr)) } .g4{ grid-template-columns:repeat(4,minmax(0,1fr)) }
.row{ display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap }
.row .sp{ flex:1 }
.stack{ display:flex; flex-direction:column; gap:var(--sp-3) }

.fg{ display:flex; flex-direction:column; gap:5px; min-width:0 }
.flabel{ font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); display:flex; align-items:center; gap:5px }
.flabel i{ font-size:10.5px; color:var(--brand-600) }
.flabel .req{ color:var(--danger) }
.inp, select.sel, .ta{ width:100%; height:34px; border:1px solid var(--border-strong); border-radius:var(--r-s); padding:0 10px; background:var(--surface-2); outline:none; font-size:12.5px;
  transition:border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast) }
.ta{ height:auto; min-height:70px; padding:8px 10px; resize:vertical; line-height:1.5 }
select.sel{ appearance:none; -webkit-appearance:none; padding-right:28px; cursor:pointer;
  background:var(--surface-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 16 16' fill='%2367748C'><path d='M8 11L3 6h10z'/></svg>") no-repeat right 10px center }
.inp:hover, select.sel:hover, .ta:hover{ border-color:#A8B5C7; background-color:#fff }
.inp:focus, select.sel:focus, .ta:focus{ border-color:var(--brand-600); background-color:#fff; box-shadow:0 0 0 3px var(--ring) }
.inp:disabled, .ta:disabled, select.sel:disabled{ opacity:.7; cursor:not-allowed; background-color:var(--surface-3) }
.inp.bad, .ta.bad{ border-color:var(--danger); box-shadow:0 0 0 3px rgba(196,38,43,.14) }
.search{ position:relative }
.search i{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:12px }
.search .inp{ padding-left:30px }

.seg{ display:inline-flex; position:relative; background:var(--surface-3); border-radius:20px; padding:3px; box-shadow:inset 0 1px 2px rgba(16,24,40,.07) }
.seg-b{ position:relative; z-index:1; min-height:28px; padding:0 12px; border:0; background:none; border-radius:16px; font-size:11px; font-weight:800; color:var(--muted); cursor:pointer;
  display:flex; align-items:center; gap:5px; white-space:nowrap; transition:color var(--t-base), background var(--t-base), box-shadow var(--t-base) }
.seg-b:hover{ color:var(--ink) }
.seg-b[aria-pressed="true"]{ color:var(--brand-700); background:#fff; box-shadow:0 1px 5px rgba(16,24,40,.16) }
.seg-b .n{ font-size:10px; color:var(--muted); font-weight:700 }

.badge{ display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 9px; border-radius:999px; font-size:10.5px; font-weight:800; white-space:nowrap;
  color:var(--bc,#475569); background:color-mix(in srgb, var(--bc,#475569) 11%, #fff); border:1px solid color-mix(in srgb, var(--bc,#475569) 24%, #fff) }
.badge::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor }
.badge.plain::before{ display:none }
.tag{ display:inline-flex; align-items:center; gap:4px; background:var(--brand-50); border:1px solid var(--brand-100); color:var(--brand-800); border-radius:5px; padding:1px 7px; font-size:10.5px; font-weight:700; white-space:nowrap }
.tag.gray{ background:var(--surface-3); border-color:var(--border); color:var(--ink-2) }
.tag .x{ cursor:pointer; opacity:.6 } .tag .x:hover{ opacity:1 }
.code{ font-family:var(--font-mono); font-size:11.5px; font-weight:600; color:var(--brand-800) }

/* bảng */
.tbl-wrap{ overflow:auto }
table.tbl{ width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px }
.tbl th{ position:sticky; top:0; z-index:1; background:var(--surface-2); text-align:left; font-size:9.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--muted);
  padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap }
.tbl td{ padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle }
.tbl tr:last-child td{ border-bottom:0 }
.tbl tbody tr{ transition:background var(--t-fast) }
.tbl tbody tr.link{ cursor:pointer }
.tbl tbody tr.link:hover{ background:var(--brand-50) }
.tbl .t-title{ font-weight:700; color:var(--ink) }
.tbl .t-sub{ font-size:11px; color:var(--muted) }

/* KPI */
.kpi{ position:relative; overflow:hidden; padding:14px 16px; cursor:pointer; transition:transform var(--t-base) var(--ease), box-shadow var(--t-base) }
.kpi:hover{ transform:translateY(-2px); box-shadow:var(--sh-2) }
.kpi-l{ font-size:9.5px; font-weight:800; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:6px }
.kpi-v{ font-size:28px; font-weight:800; letter-spacing:-.5px; margin-top:4px; color:var(--kc,var(--ink)) }
.kpi-i{ position:absolute; right:14px; top:14px; width:38px; height:38px; border-radius:12px; display:grid; place-items:center; font-size:17px;
  color:var(--kc); background:color-mix(in srgb, var(--kc) 10%, #fff) }

/* dòng thời gian */
.tl{ list-style:none; display:flex; flex-direction:column }
.tl li{ display:flex; gap:10px; padding:9px 0; border-bottom:1px dashed var(--border) }
.tl li:last-child{ border-bottom:0 }
.tl-ic{ width:26px; height:26px; flex-shrink:0; border-radius:50%; display:grid; place-items:center; font-size:12px; color:var(--tc,#475569); background:color-mix(in srgb, var(--tc,#475569) 12%, #fff) }
.tl-b{ min-width:0; flex:1 }
.tl-1{ font-size:12px } .tl-1 b{ font-weight:700 }
.tl-2{ font-size:10.5px; color:var(--muted) }
.tl-c{ margin-top:4px; padding:6px 9px; border-radius:var(--r-s); background:var(--surface-2); border:1px solid var(--border); font-size:12px; white-space:pre-wrap }

/* ══════════ HỘP THOẠI / THÔNG BÁO ══════════ */
.modal-bg{ position:fixed; inset:0; z-index:700; background:rgba(15,20,30,.46); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:20px;
  animation:fadeIn 180ms var(--ease) }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
.modal{ width:min(560px,100%); max-height:calc(100vh - 40px); display:flex; flex-direction:column; background:var(--surface); border-radius:16px; box-shadow:0 30px 80px rgba(10,15,25,.35);
  animation:popIn 260ms var(--spring) }
.modal.lg{ width:min(920px,100%) } .modal.xl{ width:min(1180px,100%); height:calc(100vh - 40px) }
@keyframes popIn{ from{opacity:0;transform:translateY(14px) scale(.97)} to{opacity:1;transform:none} }
.modal-h{ display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border) }
.modal-h h3{ font-size:14.5px; font-weight:800; display:flex; gap:8px; align-items:center }
.modal-h h3 i{ color:var(--brand-600) }
.modal-h .x{ margin-left:auto }
.modal-b{ padding:18px; overflow:auto; flex:1; min-height:0 }
.modal-f{ display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid var(--border); background:var(--surface-2); border-radius:0 0 16px 16px }

#toasts{ position:fixed; right:16px; bottom:16px; z-index:800; display:flex; flex-direction:column; gap:8px; pointer-events:none }
.toast{ pointer-events:auto; min-width:260px; max-width:420px; display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border-radius:12px; background:#131A24; color:#fff;
  box-shadow:var(--sh-3); font-size:12.5px; animation:toastIn 320ms var(--spring); white-space:pre-line }
.toast i{ font-size:15px; margin-top:1px }
.toast.ok i{ color:#4ADE80 } .toast.err{ background:#5C1114 } .toast.err i{ color:#FCA5A5 } .toast.warn i{ color:var(--accent-soft) }
.toast.out{ animation:toastOut 260ms var(--ease) forwards }
@keyframes toastIn{ from{opacity:0;transform:translateY(12px) scale(.96)} to{opacity:1;transform:none} }
@keyframes toastOut{ to{opacity:0;transform:translateX(20px)} }

/* ══════════ ĐĂNG NHẬP ══════════ */
.login{ position:fixed; inset:0; z-index:850; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(120% 90% at 50% 20%, var(--brand-800) 0%, var(--brand-950) 55%, #08090C 100%) }
.login-card{ width:min(400px,100%); background:rgba(255,255,255,.97); border-radius:20px; padding:28px; box-shadow:0 30px 90px rgba(0,0,0,.45); animation:popIn 360ms var(--spring) }
.login-logo{ width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font-size:24px; color:#fff; background:linear-gradient(135deg,var(--brand-800),var(--brand-500)); margin-bottom:14px }
.login-card h1{ font-size:19px; font-weight:800 }
.login-card p{ color:var(--muted); margin:4px 0 18px; font-size:12.5px }
.otp{ letter-spacing:10px; font-size:22px; font-weight:800; text-align:center; font-family:var(--font-mono); height:48px }

/* bản PDF */
.pdf-pages{ display:flex; flex-direction:column; align-items:center; gap:12px }
.pdf-pages canvas{ max-width:100%; background:#fff; box-shadow:0 2px 12px rgba(20,30,50,.18) }

/* công tắc / ô chọn */
.sw{ position:relative; width:34px; height:20px; display:inline-block; flex-shrink:0 }
.sw input{ opacity:0; width:0; height:0 }
.sw span{ position:absolute; inset:0; border-radius:999px; background:#C6CFDC; cursor:pointer; transition:background var(--t-base) }
.sw span::after{ content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform var(--t-base) var(--spring) }
.sw input:checked + span{ background:var(--brand-600) }
.sw input:checked + span::after{ transform:translateX(14px) }

.wf-step{ display:grid; grid-template-columns:26px 1.2fr 130px 1.6fr 110px 30px; gap:8px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--border) }
.chk{ display:inline-flex; align-items:center; gap:6px; font-size:12px; cursor:pointer }
.chk input{ accent-color:var(--brand-600); width:14px; height:14px }

.chk-list{ display:flex; flex-direction:column }
.chk-i{ display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); align-items:center }
.chk-i:last-child{ border-bottom:0 }
.chk-i i{ font-size:15px }
.chk-i .ok{ color:var(--ok) } .chk-i .bad{ color:var(--danger) }


/* ══════════ KẾ THỪA THEME.HTML (chuyển trang, phản hồi bấm, cây thư mục, màn tải, thẻ đang xử lý) ══════════ */
/* ══════════ CHUYỂN TRANG MƯỢT ══════════ */
.views{ flex:1; min-height:0; position:relative; display:flex; flex-direction:column }
.views > .view{ flex:1; min-height:0 }
.views > .view[hidden]{ display:none !important }
.view.va.soft > *{ animation:viewSoft 180ms var(--ease) both !important }
@keyframes viewSoft{ from{opacity:.4} to{opacity:1} }
.skel-wrap{ display:flex; flex-direction:column; gap:var(--sp-3) }
.skel{ position:relative; overflow:hidden; background:var(--surface) !important; border-color:var(--border) }
.skel::after{ content:''; position:absolute; inset:0; transform:translateX(-100%);
  background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--brand-100) 60%, transparent), transparent); animation:shimmer 1.2s infinite }
@keyframes shimmer{ to{ transform:translateX(100%) } }
.rip{ position:absolute; border-radius:50%; pointer-events:none; transform:translate(-50%,-50%) scale(0); background:currentColor; opacity:.18; animation:ripA 620ms ease-out forwards }
@keyframes ripA{ to{ transform:translate(-50%,-50%) scale(1); opacity:0 } }
.btn, .seg-b, .st-b, .nav-i{ position:relative; overflow:hidden }
.spin-i{ animation:spin .8s linear infinite }
.th-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px }
.th-card{ border:1.5px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer; background:#fff; text-align:left; transition:transform var(--t-base) var(--spring), border-color var(--t-fast), box-shadow var(--t-fast) }
.th-card:hover{ transform:translateY(-2px); box-shadow:var(--sh-2) }
.th-card[aria-pressed="true"]{ border-color:var(--brand-600); box-shadow:0 0 0 3px var(--ring) }
.th-prev{ height:64px; display:grid; grid-template-columns:34% 1fr }
.th-prev .a{ background:linear-gradient(170deg,var(--c0),var(--c1)) }
.th-prev .b{ background:#F1F3F7; padding:8px; display:flex; flex-direction:column; gap:5px }
.th-prev .b i{ display:block; height:6px; border-radius:3px; background:#DDE2EA } .th-prev .b i.p{ width:46%; background:var(--c1) }
.th-card b{ display:block; padding:8px 10px; font-size:12px }
.th-grid{ grid-template-columns:repeat(auto-fill,minmax(230px,1fr)) !important }
.th-card{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:14px; position:relative }
.th-strip{ display:flex; width:78px; height:40px; border-radius:9px; overflow:hidden; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06) }
.th-strip i{ flex:1 }
.th-card .th-t{ min-width:0; flex:1 }
.th-card .th-t b{ padding:0; font-size:14px; font-weight:800 }
.th-card .th-t span{ display:block; font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.th-card .th-ck{ position:absolute; top:9px; right:9px; width:20px; height:20px; border-radius:50%; background:var(--brand-600); color:#fff; display:none; place-items:center; font-size:11px }
.th-card[aria-pressed="true"] .th-ck{ display:grid }

/* ══════════ PHẢN HỒI KHI BẤM ══════════ */
:focus:not(:focus-visible){ outline:none }
.seg-b:focus-visible, .lx-opt:focus-visible, .th-card:focus-visible, .st-b:focus-visible{ outline-offset:-3px }
.btn, .ibtn, .seg-b, .nav-i, .ol-i, .kpi, .th-card, .lx-opt, .pal-i, .lay-i, .set-nav button, .tree-i{ -webkit-tap-highlight-color:transparent }
.btn:active, .ibtn:active, .seg-b:active, .th-card:active, .lx-opt:active, .pal-i:active, .set-nav button:active, .tree-i:active{ transform:scale(.94) !important; transition-duration:60ms !important }
.nav-i:active{ transform:scale(.97) }
.tap{ animation:tapPop 320ms var(--spring) }
@keyframes tapPop{ 0%{ transform:scale(.92) } 55%{ transform:scale(1.03) } 100%{ transform:scale(1) } }
.btn.tap::before, .ibtn.tap::before{ content:''; position:absolute; inset:-3px; border-radius:inherit; box-shadow:0 0 0 0 var(--ring); animation:tapRing 420ms ease-out; pointer-events:none }
@keyframes tapRing{ from{ box-shadow:0 0 0 0 color-mix(in srgb, var(--brand-500) 45%, transparent) } to{ box-shadow:0 0 0 9px transparent } }
.rip{ opacity:.28 }
.btn.pri .rip, .btn.ok .rip{ background:#fff; opacity:.4 }
.ftree-h .sp{ flex:1 }
.ftree-q{ display:flex; align-items:center; gap:6px; height:32px; margin:2px 0 6px; padding:0 4px 0 10px; border-radius:10px; background:var(--surface); border:1px solid var(--border); font-size:12.5px }
.ftree-q:focus-within{ border-color:var(--brand-600); box-shadow:0 0 0 3px var(--ring) }
.ftree-q > i{ color:var(--muted); font-size:12px } .ftree-q input{ flex:1; min-width:0; border:0; outline:0; background:none; font:inherit; color:var(--ink) } .ftree-q .ibtn{ width:22px; height:22px; font-size:11px }
.tree-i{ display:flex; align-items:center; gap:6px; width:100%; min-height:32px; padding:4px 6px; border:0; background:none; border-radius:8px; cursor:pointer; font-size:12.5px; color:var(--ink-2); text-align:left; position:relative;
  transition:background var(--t-fast), color var(--t-fast), box-shadow var(--t-fast) }
.tree-i:hover{ background:var(--surface-3) }
.tree-i.on{ background:var(--brand-50); color:var(--brand-800); font-weight:700 }
.tree-i.drop{ background:color-mix(in srgb, var(--brand-100) 80%, #fff); box-shadow:inset 0 0 0 2px var(--brand-500) }
.tree-i .cr{ width:16px; flex-shrink:0; color:var(--muted); font-size:10px; transition:transform var(--t-base) var(--ease) }
.tree-i .cr.open{ transform:rotate(90deg) }
.tree-i .fi{ color:var(--fc, #E0A526); font-size:14px }
.tree-i .nm{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.tree-i .ct{ font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums }
.tree-i .lk{ font-size:10px; color:var(--warn) }
.tree-i .tr-ac{ display:none; gap:0; flex-shrink:0 }
.tree-i:hover .tr-ac{ display:flex } .tree-i:hover .ct{ display:none }
.tree-i .tr-ac span{ width:22px; height:22px; border-radius:6px; display:grid; place-items:center; color:var(--muted) }
.tree-i .tr-ac span:hover{ background:#fff; color:var(--ink) }
.tree-kids{ margin-left:12px; border-left:1px dashed var(--border-strong); padding-left:4px }
.tg{ display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 8px; border-radius:999px; font-size:10.5px; font-weight:700; white-space:nowrap; cursor:pointer;
  color:hsl(var(--h) 55% 32%); background:hsl(var(--h) 70% 95%); border:1px solid hsl(var(--h) 55% 85%); transition:transform var(--t-fast) }
.tg:hover{ transform:translateY(-1px) } .tg.on{ background:hsl(var(--h) 60% 42%); color:#fff; border-color:transparent }
.tg .x{ opacity:.6 } .tg .x:hover{ opacity:1 }
/* ══════════ MÀN HÌNH TẢI SINH ĐỘNG ══════════ */
.ld{ min-height:min(62vh,560px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; animation:fadeIn 300ms var(--ease) }
.ld.sm{ min-height:220px; gap:10px }
.ld-orb{ position:relative; width:92px; height:92px; display:grid; place-items:center }
.ld.sm .ld-orb{ width:64px; height:64px }
.ld-orb > i{ font-size:28px; color:var(--brand-600); animation:ldBob 1.6s var(--ease) infinite; z-index:1 }
.ld.sm .ld-orb > i{ font-size:20px }
.ld-ring{ position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0deg, var(--brand-400) 90deg, var(--brand-700) 170deg, transparent 230deg);
  -webkit-mask:radial-gradient(circle, transparent 58%, #000 60%); mask:radial-gradient(circle, transparent 58%, #000 60%); animation:spin 1.15s linear infinite }
.ld-ring.r2{ inset:12px; opacity:.45; animation-duration:1.9s; animation-direction:reverse;
  background:conic-gradient(from 90deg, transparent 0deg, var(--accent-soft) 120deg, transparent 200deg) }
.ld-dot{ position:absolute; width:9px; height:9px; border-radius:50%; background:var(--brand-600); top:50%; left:50%; margin:-4.5px;
  animation:ldOrbit 1.8s cubic-bezier(.5,.1,.5,.9) infinite; box-shadow:0 0 0 3px color-mix(in srgb, var(--brand-100) 70%, transparent) }
.ld-dot.d2{ animation-delay:-.6s; background:var(--accent-soft) } .ld-dot.d3{ animation-delay:-1.2s; background:var(--brand-400) }
@keyframes ldOrbit{ from{ transform:rotate(0deg) translateX(58px) scale(.7) } 50%{ transform:rotate(180deg) translateX(58px) scale(1.15) } to{ transform:rotate(360deg) translateX(58px) scale(.7) } }
.ld.sm .ld-dot{ animation-name:ldOrbitS }
@keyframes ldOrbitS{ from{ transform:rotate(0deg) translateX(40px) } to{ transform:rotate(360deg) translateX(40px) } }
@keyframes ldBob{ 0%,100%{ transform:translateY(0) scale(1) } 50%{ transform:translateY(-4px) scale(1.08) } }
.ld-t{ font-size:15px; font-weight:800; color:var(--ink); letter-spacing:-.1px }
.ld-t span{ background:linear-gradient(90deg,var(--brand-700),var(--accent-soft),var(--brand-700)); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:sweep 2.2s linear infinite }
.ld-tip{ display:flex; gap:8px; align-items:center; max-width:460px; padding:8px 14px; border-radius:999px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--sh-1); font-size:12px; color:var(--ink-2) }
.ld-tip i{ color:var(--accent) } .ld-tip span{ transition:opacity 250ms }
@media (prefers-reduced-motion:reduce){ .ld-ring, .ld-dot, .ld-orb > i, .ld-t span{ animation:none } }

/* ── đang xử lý: nút có vệt sáng quét + thẻ nổi ở giữa đáy màn hình ── */
.btn.busy{ opacity:1 !important; cursor:progress }
.modal-f .modal-wait{ margin-right:auto; display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:#7A4A06 } .modal-f .modal-wait i{ animation:spin 1.6s linear infinite }
.btn.busy::after{ content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit; background-size:220% 100%; animation:btnSheen 1.05s linear infinite;
  background-image:linear-gradient(110deg, transparent 25%, rgba(255,255,255,.34) 45%, rgba(255,255,255,.34) 55%, transparent 75%) }
.btn:not(.pri).busy::after{ background-image:linear-gradient(110deg, transparent 25%, color-mix(in srgb, var(--brand-500) 20%, transparent) 50%, transparent 75%) }
@keyframes btnSheen{ from{ background-position:120% 0 } to{ background-position:-120% 0 } }
#workPill{ position:fixed; left:50%; top:calc(var(--tb-h) + 12px); z-index:850; transform:translate(-50%, -160%); opacity:0; pointer-events:none;
  display:flex; align-items:center; gap:12px; min-width:280px; max-width:calc(100vw - 32px); padding:12px 18px 14px; border-radius:16px;
  background:#131A24; color:#fff; box-shadow:0 18px 40px rgba(10,15,25,.35); transition:transform 360ms var(--spring), opacity 200ms; overflow:hidden }
#workPill.on{ transform:translate(-50%, 0); opacity:1 }
#workPill .wp-ring{ width:26px; height:26px; flex-shrink:0; border-radius:50%; border:3px solid rgba(255,255,255,.18); border-top-color:var(--brand-400, #7aa2ff); animation:spin .8s linear infinite }
#workPill .wp-t{ display:flex; flex-direction:column; min-width:0 }
#workPill b{ font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#workPill small{ font-size:11px; opacity:.7 }
#workPill .wp-s{ margin-left:auto; font:700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; opacity:.8; padding-left:8px }
#workPill .wp-bar{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.1) }
#workPill .wp-bar::after{ content:''; position:absolute; top:0; bottom:0; width:35%; border-radius:3px; background:linear-gradient(90deg, transparent, var(--brand-400, #7aa2ff), transparent); animation:wpBar 1.2s ease-in-out infinite }
@keyframes wpBar{ from{ left:-35% } to{ left:100% } }
#workPill.done .wp-ring{ animation:none; border-color:#22C55E; background:#22C55E; position:relative }
#workPill.done .wp-ring::after{ content:'✓'; position:absolute; inset:0; display:grid; place-items:center; font-size:14px; font-weight:900; color:#fff }
#workPill.done .wp-bar{ display:none }
@media (prefers-reduced-motion:reduce){ .btn.busy::after{ animation-duration:2.4s } #workPill .wp-bar::after{ animation-duration:2.4s } }

/* ══════════ ĐÁP ỨNG ══════════ */
/* ══════════ ĐÁP ỨNG ══════════ */
@media (max-width:1100px){
  .app:not(.wide) .sb{ width:var(--sb-w-min) } .app:not(.wide) .sb-name, .app:not(.wide) .nav-t, .app:not(.wide) .sb-user-t, .app:not(.wide) .sb-btn span{ display:none }

  .g4{ grid-template-columns:repeat(2,minmax(0,1fr)) }
}

  .sb{ position:fixed; inset:0 auto 0 0; width:var(--sb-w) !important; transform:translateX(-100%); z-index:200 }
  .app.navopen .sb{ transform:none }
  .app.enter .sb{ animation:none }   /* hiệu ứng mở app giữ transform:none → che mất trạng thái ẩn thanh bên trên điện thoại */
  .app .sb-name, .app .nav-t, .app .sb-user-t, .app .sb-btn span{ display:revert !important }
  .app .nav-i{ justify-content:flex-start !important; padding:10px var(--sp-3) !important }
  .sb-scrim{ display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:190; opacity:0; pointer-events:none; transition:opacity var(--t-base) }
  .app.navopen .sb-scrim{ opacity:1; pointer-events:auto }
  .tb-burger{ display:flex }
  .g2, .g3, .g4{ grid-template-columns:minmax(0,1fr) }

}
/* nút thu gọn thanh bên */
.sb-tog{ margin-left:auto; flex-shrink:0; width:30px; height:30px; display:grid; place-items:center; border:0; border-radius:9px; background:transparent; color:var(--sb-ink-3);
  font-size:16px; cursor:pointer; opacity:0; transform:translateX(-4px); transition:opacity var(--t-base), transform var(--t-base) var(--spring), background var(--t-base), color var(--t-base) }
.sb-brand:hover .sb-tog, .sb-tog:focus-visible{ opacity:1; transform:none }
.sb-tog:hover{ background:var(--sb-hover); color:var(--sb-ink) }
.app.mini .sb-tog{ position:absolute; left:50%; top:50%; width:36px; height:36px; margin:-18px 0 0 -18px; border-radius:12px; transform:scale(.85);
  background:var(--sb-hover); color:var(--sb-ink); box-shadow:inset 0 0 0 1px var(--sb-line) }
.app.mini .sb-brand:hover .sb-tog{ opacity:1; transform:scale(1) }
.app.mini .sb-brand:hover .sb-logo{ opacity:0 }
@media (hover:none){ .sb-tog{ opacity:1; transform:none } .app.mini .sb-tog{ opacity:0 } }

/* ══════════════════════════════════════════════════════════════
   BỘ MÀU — chỉ đổi thang --brand-*; mọi thành phần đã dùng token nên tự theo
   ══════════════════════════════════════════════════════════════ */
html[data-theme="red"]{ --brand-950:#3A0A0C; --brand-900:#5C1114; --brand-800:#7A171B; --brand-700:#9B1C1F; --brand-600:#BE2328; --brand-500:#DC3B40; --brand-400:#EE7174; --brand-100:#FBE1E2; --brand-50:#FDF3F3; --ring:rgba(190,35,40,.32); --accent:#B45309; --accent-soft:#F0B429 }
html[data-theme="blue"]{ --brand-950:#0B1F44; --brand-900:#0F2A5C; --brand-800:#153A7E; --brand-700:#1D4ED8; --brand-600:#2563EB; --brand-500:#3B82F6; --brand-400:#60A5FA; --brand-100:#DBEAFE; --brand-50:#EFF6FF; --ring:rgba(37,99,235,.3); --accent-soft:#F0B429 }
/* Trắng xanh: mọi thứ nền trắng, thanh bên trắng, chữ & điểm nhấn xanh dương */
html[data-theme="white"]{ --brand-950:#0B1F44; --brand-900:#0F2A5C; --brand-800:#1E40AF; --brand-700:#1D4ED8; --brand-600:#2563EB; --brand-500:#3B82F6; --brand-400:#60A5FA; --brand-100:#DBEAFE; --brand-50:#EFF6FF; --ring:rgba(37,99,235,.28); --accent:#2563EB; --accent-soft:#93C5FD;
  --bg:#F5F8FF; --surface:#FFFFFF; --surface-2:#F8FAFF; --surface-3:#EEF3FC; --border:#E3EAF6; --border-strong:#CBD6EA;
  --sb-bg:#FFFFFF; --sb-glow:none; --sb-ink:#0F2A5C; --sb-ink-2:#334A75; --sb-ink-3:#7385A6; --sb-sec:#93A3BF; --sb-line:#E8EEF8; --sb-hover:#F1F5FD;
  --sb-pill:#EAF1FF; --sb-pill-sh:inset 0 0 0 1px #D3E1FB; --sb-accent:#2563EB }
html[data-theme="white"]:not([data-glass]) body{ background:#F5F8FF }
html[data-theme="white"]:not([data-glass]) .sb{ box-shadow:1px 0 0 #E3EAF6 }
html[data-theme="white"] .sb-logo{ background:linear-gradient(150deg,#2563EB,#1D4ED8); color:#fff; border:0; box-shadow:0 4px 10px rgba(37,99,235,.25) }
html[data-theme="white"] .nav-i[aria-current="page"]{ color:#1D4ED8 }
html[data-theme="white"] .sb-user{ background:#F5F8FF; border:1px solid #E3EAF6 }
html[data-theme="white"] .sb-btn{ border-color:#DCE5F4; background:#fff; color:#334A75 } html[data-theme="white"] .sb-btn:hover{ background:#EEF3FC; color:#1D4ED8 }
html[data-theme="white"] .sb-tog, html[data-theme="white"] .sb-out{ color:#7385A6 }
html[data-theme="white"] .nav-badge{ background:#2563EB; color:#fff }
html[data-theme="white"] .sb :focus-visible{ outline-color:#2563EB }
html[data-theme="violet"]{ --brand-950:#1E0B3A; --brand-900:#2E1065; --brand-800:#4C1D95; --brand-700:#6D28D9; --brand-600:#7C3AED; --brand-500:#8B5CF6; --brand-400:#A78BFA; --brand-100:#EDE9FE; --brand-50:#F5F3FF; --ring:rgba(124,58,237,.3); --accent-soft:#F0B429 }
html[data-theme="teal"]{ --brand-950:#042F2E; --brand-900:#134E4A; --brand-800:#115E59; --brand-700:#0F766E; --brand-600:#0D9488; --brand-500:#14B8A6; --brand-400:#2DD4BF; --brand-100:#CCFBF1; --brand-50:#F0FDFA; --ring:rgba(13,148,136,.3); --accent-soft:#F0B429 }
html[data-theme="graphite"]{ --brand-950:#0B0F17; --brand-900:#111827; --brand-800:#1F2937; --brand-700:#334155; --brand-600:#475569; --brand-500:#64748B; --brand-400:#94A3B8; --brand-100:#E2E8F0; --brand-50:#F1F5F9; --ring:rgba(71,85,105,.3); --accent-soft:#FBBF24 }

/* ══════════ THANH BÊN: nút thu gọn + phiên bản ══════════ */
.sb-ver{ font-size:10px; color:var(--sb-ink-3); padding:2px 8px 0; letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.app.mini .sb-ver{ display:none }
.sb-user.clk{ cursor:pointer } .sb-user.clk:hover{ background:rgba(0,0,0,.34) }

/* ══════════ Ô TÌM NHANH TRÊN THANH TRÊN ══════════ */
.tb-title{ flex:1 1 auto; overflow:hidden } .crumb{ overflow:hidden; text-overflow:ellipsis } .crumb a{ overflow:hidden; text-overflow:ellipsis }
.tb-search, .tb-right{ flex-shrink:0 }
.tb-search{ margin-left:auto; display:flex; align-items:center; gap:8px; height:36px; width:min(340px,32vw); padding:0 8px 0 12px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--muted); font-size:12.5px; cursor:pointer; transition:border-color var(--t-fast), background var(--t-fast), box-shadow var(--t-fast) }
.tb-search:hover{ border-color:var(--border-strong); background:#fff; box-shadow:var(--sh-1) }
.tb-search span{ flex:1; text-align:left }
.tb-search kbd{ font:600 10.5px/1 var(--font-mono); padding:4px 6px; border-radius:6px; background:#fff; border:1px solid var(--border); color:var(--muted) }
.tb-search + .tb-right{ margin-left:0 }

/* ══════════ BẢNG LỆNH TÌM NHANH (⌘K) ══════════ */
.pal-bg{ position:fixed; inset:0; z-index:720; background:rgba(15,20,30,.42); backdrop-filter:blur(3px); display:flex; justify-content:center; padding:10vh 16px 16px; animation:fadeIn 160ms var(--ease) }
.pal{ width:min(680px,100%); max-height:72vh; display:flex; flex-direction:column; background:var(--surface); border-radius:18px; box-shadow:0 30px 80px rgba(10,15,25,.35); overflow:hidden; animation:popIn 240ms var(--spring) }
.pal-in{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border) }
.pal-in i{ font-size:17px; color:var(--brand-600) }
.pal-in input{ flex:1; border:0; outline:0; background:transparent; font-size:16px; font-weight:600; min-width:0 }
.pal-in kbd{ font:600 10.5px/1 var(--font-mono); padding:4px 6px; border-radius:6px; background:var(--surface-3); color:var(--muted) }
.pal-l{ overflow:auto; padding:6px }
.pal-g{ font-size:9.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--muted); padding:10px 10px 4px }
.pal-i{ display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border:0; background:none; border-radius:10px; cursor:pointer; text-align:left }
.pal-i:hover, .pal-i.hl{ background:var(--brand-50) }
.pal-i .pt{ flex:1; min-width:0 }
.pal-i .pt b{ display:block; font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.pal-i .pt small{ display:block; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.pal-i mark, .fl-n mark, .fc-t mark, .ltbl mark, .find-i mark{ background:color-mix(in srgb, var(--accent-soft) 45%, #fff); color:inherit; border-radius:3px; padding:0 1px }
.pal-f{ display:flex; gap:14px; padding:9px 16px; border-top:1px solid var(--border); background:var(--surface-2); font-size:11px; color:var(--muted) }
.pal-f kbd{ font:600 10px/1 var(--font-mono); padding:3px 5px; border-radius:5px; background:#fff; border:1px solid var(--border); margin-right:3px }

/* ══════════ BIỂU TƯỢNG LOẠI FILE + NHÃN LOẠI TÀI LIỆU ══════════ */
.fic{ width:34px; height:34px; flex-shrink:0; border-radius:10px; display:grid; place-items:center; font-size:16px; color:var(--fc,#475569); background:color-mix(in srgb, var(--fc,#475569) 11%, #fff) }
.fic.sm{ width:26px; height:26px; border-radius:8px; font-size:13px }
.fic.lg{ width:46px; height:46px; border-radius:14px; font-size:22px }
.kd{ display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:999px; font-size:10.5px; font-weight:800; white-space:nowrap;
  color:var(--kc,#475569); background:color-mix(in srgb, var(--kc,#475569) 10%, #fff); border:1px solid color-mix(in srgb, var(--kc,#475569) 22%, #fff) }
.kd i{ font-size:11px }
.gr{ display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:6px; font-size:10.5px; font-weight:800; background:var(--brand-50); color:var(--brand-800); border:1px solid var(--brand-100); white-space:nowrap }
.newb{ display:inline-flex; align-items:center; height:18px; padding:0 6px; border-radius:999px; font-size:9.5px; font-weight:800; letter-spacing:.4px; background:var(--orange); color:#fff }

/* ══════════ TỔNG QUAN ══════════ */
.hero{ position:relative; overflow:hidden; border-radius:18px; padding:26px 26px 22px; color:#fff; box-shadow:var(--sh-2);
  background:radial-gradient(130% 120% at 100% 0%, oklch(0.72 0.12 245 / .55) 0%, transparent 42%), linear-gradient(135deg, var(--brand-900), var(--brand-700) 60%, var(--brand-600)) }
.hero::after{ content:''; position:absolute; right:-70px; bottom:-90px; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); pointer-events:none }
.hero h2{ font-size:22px; font-weight:800; letter-spacing:-.3px; text-wrap:balance }
.hero p{ opacity:.82; margin-top:4px; font-size:13px; max-width:620px }
.hero-q{ position:relative; z-index:1; margin-top:16px; display:flex; align-items:center; gap:10px; height:48px; max-width:640px; padding:0 8px 0 16px; border-radius:14px; background:#fff; color:var(--ink);
  box-shadow:0 10px 30px rgba(0,0,0,.18); cursor:text }
.hero-q i{ color:var(--brand-600); font-size:17px }
.hero-q span{ flex:1; color:var(--muted); font-size:14px }
.hero-q kbd{ font:600 11px/1 var(--font-mono); padding:5px 7px; border-radius:7px; background:var(--surface-3); color:var(--muted) }
.hero-chips{ position:relative; z-index:1; display:flex; flex-wrap:wrap; gap:6px; margin-top:12px }
.hero-chips button{ height:28px; padding:0 11px; border-radius:999px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.1); color:#fff; font-size:11.5px; font-weight:700; cursor:pointer; transition:background var(--t-fast) }
.hero-chips button:hover{ background:rgba(255,255,255,.22) }
.kpis{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px }
.kpi .kpi-s{ font-size:11px; color:var(--muted); margin-top:2px }
.bars{ display:flex; flex-direction:column; gap:7px }
.bar-r{ display:grid; grid-template-columns:110px 1fr 46px; gap:10px; align-items:center; font-size:12px; cursor:pointer; padding:3px 4px; border-radius:7px }
.bar-r:hover{ background:var(--surface-2) }
.bar-r .bl{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.bar-r .bt{ height:10px; border-radius:6px; background:var(--surface-3); overflow:hidden }
.bar-r .bt b{ display:block; height:100%; border-radius:6px; background:linear-gradient(90deg, var(--brand-700), var(--brand-500)); transition:width .6s var(--ease) }
.bar-r .bn{ text-align:right; font-weight:700; color:var(--ink-2); font-variant-numeric:tabular-nums }
.kgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:8px }
.kbox{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; border:1px solid var(--border); background:var(--surface); cursor:pointer; text-align:left; transition:transform var(--t-base) var(--spring), box-shadow var(--t-fast), border-color var(--t-fast) }
.kbox:hover{ transform:translateY(-2px); box-shadow:var(--sh-2); border-color:color-mix(in srgb, var(--kc) 40%, var(--border)) }
.kbox b{ display:block; font-size:12.5px } .kbox small{ font-size:11px; color:var(--muted) }
.spark{ display:flex; align-items:flex-end; gap:4px; height:64px }
.spark i{ flex:1; border-radius:4px 4px 2px 2px; background:color-mix(in srgb, var(--brand-600) 70%, #fff); min-height:3px; position:relative }
.spark i:hover{ background:var(--brand-700) }

/* danh sách file gọn */
.flist{ display:flex; flex-direction:column }
.fl{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; cursor:pointer; min-width:0; transition:background var(--t-fast) }
.fl:hover{ background:var(--brand-50) }
.fl-b{ flex:1; min-width:0 }
.fl-n{ font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.fl-m{ font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.fl-r{ font-size:11px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums }

/* ══════════ THƯ VIỆN ══════════ */
.view.lib-view{ padding:0; gap:0; overflow:hidden }

.tree-i .fi.srcic{ color:var(--sc, var(--brand-600)) }
.tree-i.root{ font-weight:800; color:var(--ink) }
.lib-bar{ position:sticky; top:0; z-index:20; display:flex; flex-direction:column; gap:10px; padding:12px var(--sp-4); background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border) }
.lib-r1{ display:flex; align-items:center; gap:8px; flex-wrap:wrap }
.lib-q{ flex:1 1 300px; display:flex; align-items:center; gap:8px; height:38px; padding:0 6px 0 12px; border-radius:12px; background:var(--surface); border:1px solid var(--border-strong); transition:border-color var(--t-fast), box-shadow var(--t-fast) }
.lib-q:focus-within{ border-color:var(--brand-600); box-shadow:0 0 0 3px var(--ring) }
.lib-q > i{ color:var(--muted) }
.lib-q input{ flex:1; border:0; outline:0; background:transparent; font-size:13.5px; min-width:0 }

/* ══════════ XEM TÀI LIỆU ══════════ */

.vw-head h2{ font-size:15px; font-weight:800; line-height:1.3; word-break:break-word }

.vw-tab:hover{ border-color:var(--border-strong); background:#fff }
.vw-tab[aria-current="true"]{ background:var(--kc,var(--brand-700)); border-color:transparent; color:#fff }
.vw-tab i{ color:var(--kc) } .vw-tab[aria-current="true"] i{ color:#fff }
.vw-tool{ display:flex; align-items:center; gap:6px; padding:6px var(--sp-4); background:var(--surface-2); border-bottom:1px solid var(--border); flex-wrap:wrap }

.pg-in{ width:46px; height:28px; border:1px solid var(--border-strong); border-radius:7px; text-align:center; font:700 12px var(--font-mono); background:#fff; outline:none }

.zm{ min-width:48px; text-align:center; font:700 11.5px var(--font-mono); color:var(--ink-2); cursor:pointer; padding:0 4px }

.pg.loading::after{ content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(220,226,234,.6), transparent); background-size:200% 100%; animation:sweep 1.2s linear infinite }
.pg.hit{ box-shadow:0 0 0 3px var(--accent-soft), 0 2px 14px rgba(20,30,50,.18) }
.vw-img{ max-width:100%; display:block; margin:0 auto; box-shadow:0 2px 14px rgba(20,30,50,.18); background:#fff }
.vw-text{ max-width:900px; margin:0 auto; background:#fff; padding:28px 32px; border-radius:6px; white-space:pre-wrap; font:13px/1.6 var(--font-mono); box-shadow:0 2px 14px rgba(20,30,50,.12) }
.vw-side{ border-left:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column; min-width:0; overflow:hidden }
.vw.noside .vw-side{ display:none }
.st-b{ display:flex; align-items:center; gap:5px; padding:8px 8px; border:0; background:none; border-bottom:2px solid transparent; font-size:11.5px; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap;
  transition:color var(--t-fast), border-color var(--t-fast) }

.find-r{ display:flex; flex-direction:column; gap:4px; margin-top:10px }

.find-i:hover{ border-color:var(--brand-400); background:var(--brand-50) }
.find-i b{ font:800 11px var(--font-mono); color:var(--brand-800); white-space:nowrap }
.vw-ph{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; min-height:60vh; text-align:center; color:var(--ink-2); padding:30px }

.app.reading .sb, .app.reading .tb{ display:none }

/* ══════════ NGUỒN DỮ LIỆU ══════════ */
.src-list{ display:flex; flex-direction:column; gap:12px }

.src h3{ font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:8px; flex-wrap:wrap }
.src .sm{ display:flex; flex-wrap:wrap; gap:4px 14px; font-size:11.5px; color:var(--muted); margin-top:4px }

.src-res .p{ color:var(--ok) } .src-res .m{ color:var(--danger) } .src-res .c{ color:var(--info) }
.scan{ grid-column:1 / -1; margin-top:2px; padding:12px 14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border) }

.scan-t .sp{ flex:1 }
.scan-bar{ height:6px; border-radius:6px; background:var(--surface-3); overflow:hidden; margin:9px 0 7px }
.scan-bar b{ display:block; height:100%; width:30%; border-radius:6px; background:linear-gradient(90deg, var(--brand-700), var(--brand-400)); animation:scanMove 1.4s ease-in-out infinite }
.scan.done .scan-bar b{ width:100% !important; animation:none; background:var(--ok) }
@keyframes scanMove{ 0%{ margin-left:-30% } 100%{ margin-left:100% } }
.scan-n{ display:flex; flex-wrap:wrap; gap:4px 16px; font-size:11.5px; color:var(--muted) }
.scan-n b{ color:var(--ink); font-variant-numeric:tabular-nums }
.scan-cur{ font-size:11px; color:var(--muted); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:var(--font-mono) }
.probe{ display:flex; flex-direction:column; gap:6px; margin-top:10px }
.probe-i{ display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:10px; border:1px solid var(--border); background:#fff; font-size:12px }
.probe-i.bad{ border-color:#F5C2C3; background:var(--brand-50) }
.probe-i .pi{ font-size:17px } .probe-i.ok .pi{ color:var(--ok) } .probe-i.bad .pi{ color:var(--danger) }
.probe-i .pb{ flex:1; min-width:0 } .probe-i .pb b{ display:block } .probe-i .pb small{ color:var(--muted); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.steps-h{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px }
.step-c{ display:flex; gap:12px; padding:14px; border-radius:14px; background:var(--surface); border:1px dashed var(--border-strong) }
.step-c .no{ width:28px; height:28px; flex-shrink:0; border-radius:50%; display:grid; place-items:center; background:var(--brand-700); color:#fff; font-weight:800; font-size:12px }
.step-c b{ display:block; font-size:12.5px } .step-c small{ color:var(--muted); font-size:11.5px }

/* ══════════ CÀI ĐẶT ══════════ */
.set-lay{ display:grid; grid-template-columns:220px minmax(0,1fr); gap:var(--sp-3); align-items:start }
.set-nav{ display:flex; flex-direction:column; gap:2px; padding:8px; position:sticky; top:0 }
.rule-row{ display:grid; grid-template-columns:22px 40px 170px minmax(0,1fr) 120px 30px; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--border) }
.rule-row.h{ font-size:9.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); background:var(--surface-2) }
.rule-row .inp{ height:30px; font-size:12px }
.rule-row .grip{ cursor:grab; color:var(--muted) }
.rule-row input[type=color]{ width:34px; height:30px; padding:2px; border:1px solid var(--border-strong); border-radius:7px; background:#fff; cursor:pointer }
.ic-pick{ height:30px; border:1px solid var(--border-strong); border-radius:7px; background:var(--surface-2); display:flex; align-items:center; gap:6px; padding:0 8px; cursor:pointer; font-size:11px }
.ic-pop{ position:fixed; z-index:780; width:280px; padding:8px; background:#fff; border:1px solid var(--border-strong); border-radius:12px; box-shadow:var(--sh-3); display:grid; grid-template-columns:repeat(8,1fr); gap:3px; animation:popIn 180ms var(--spring) }
.ic-pop button{ height:30px; border:0; background:none; border-radius:7px; cursor:pointer; font-size:15px; color:var(--ink-2) }
.ic-pop button:hover{ background:var(--brand-50); color:var(--brand-700) }
.sys-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border) }
.sys-row:last-child{ border-bottom:0 }
.sys-row > i{ font-size:18px; color:var(--brand-600); width:22px; text-align:center }
.sys-row .sb2{ flex:1; min-width:0 } .sys-row .sb2 b{ display:block; font-size:12.5px } .sys-row .sb2 small{ color:var(--muted); font-size:11.5px; display:block; word-break:break-all }
.chg{ font-size:11.5px; display:flex; gap:6px; align-items:center; padding:5px 0; border-bottom:1px dashed var(--border) }

@media (max-width:1100px){
  .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)) }
  .vw{ grid-template-columns:minmax(0,1fr) 0 } .vw-side{ display:none }
  .vw.side-open .vw-side{ display:flex; position:fixed; right:0; top:var(--tb-h); bottom:0; width:min(340px,90vw); z-index:170; box-shadow:var(--sh-3) }
  .steps-h{ grid-template-columns:minmax(0,1fr) }
}
@media (max-width:820px){
  .tb-search{ width:auto; padding:0 10px } .tb-search span, .tb-search kbd{ display:none }
  .lib-lay{ grid-template-columns:minmax(0,1fr) }
  .lib-tree{ display:none; position:fixed; left:0; top:var(--tb-h); bottom:0; width:min(320px,88vw); z-index:175; box-shadow:var(--sh-3) }
  .lib-lay.tree-open .lib-tree{ display:block }
  .set-lay{ grid-template-columns:minmax(0,1fr) } .set-nav{ position:static; flex-direction:row; overflow-x:auto }
  .src{ grid-template-columns:auto minmax(0,1fr) } .src .sa{ grid-column:1 / -1; justify-content:flex-start }
  .rule-row{ grid-template-columns:22px 40px 1fr 30px } .rule-row .rw, .rule-row .ri{ grid-column:2 / -1 }
  .fgrid{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px }
  .hero{ padding:20px 18px } .hero h2{ font-size:19px }
  .bar-r{ grid-template-columns:84px 1fr 40px }
}
@media (min-width:1101px){ .vw-side-btn{ display:none } }
@media (min-width:821px){ .tree-btn{ display:none } }
.set-nav button{ display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border:0; border-radius:10px; background:none; font-size:12.5px; font-weight:600; color:var(--ink-2); cursor:pointer; text-align:left; white-space:nowrap; transition:background var(--t-fast), color var(--t-fast) }
.set-nav button:hover{ background:var(--surface-3); color:var(--ink) }
.set-nav button[aria-current="page"]{ background:var(--brand-50); color:var(--brand-800); font-weight:800; box-shadow:inset 3px 0 0 var(--brand-600) }
.set-nav button i{ color:var(--brand-600); width:16px; text-align:center }
.glass-row{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:14px; border:1px solid var(--border); background:var(--surface-2); margin-top:14px; cursor:pointer }
.glass-row .gp{ width:78px; height:44px; border-radius:10px; flex-shrink:0; position:relative; overflow:hidden;
  background:radial-gradient(60% 70% at 20% 30%, var(--brand-400), transparent 70%), radial-gradient(60% 70% at 80% 70%, rgba(125,211,252,.9), transparent 70%), #E9EDF4 }
.glass-row .gp::after{ content:''; position:absolute; inset:8px 12px; border-radius:8px; background:rgba(255,255,255,.55); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.8) }
.glass-row .gt{ flex:1; min-width:0 } .glass-row .gt b{ display:block; font-size:14px } .glass-row .gt span{ font-size:11.5px; color:var(--muted) }

/* ══════════════════════════════════════════════════════════════
   LIQUID GLASS — kính mờ kiểu iOS 26 (kế thừa docs.htlvn), giữ màu nhấn Kiến Trẻ
   ══════════════════════════════════════════════════════════════ */
html[data-glass]{
  --bg:#EEF1F7; --surface:rgba(255,255,255,.9); --surface-2:rgba(248,250,253,.94); --surface-3:rgba(118,118,128,.1);
  --border:rgba(255,255,255,.7); --border-strong:rgba(15,23,42,.14);
  --glass-bd:1px solid rgba(255,255,255,.75);
  --glass-sh:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.03), 0 10px 30px oklch(0.346 0.124 250.4 / .10), 0 1px 3px rgba(30,40,60,.06);
  --sb-bg:rgba(255,255,255,.82); --sb-glow:none; --sb-ink:oklch(0.145 0 0); --sb-ink-2:oklch(0.373 0.034 259.733); --sb-ink-3:oklch(0.5 0.03 250.4);
  --sb-sec:rgba(11,13,18,.4); --sb-line:rgba(0,0,0,.06); --sb-hover:rgba(0,0,0,.05);
  --sb-pill:rgba(255,255,255,.95); --sb-pill-sh:0 6px 18px oklch(0.346 0.124 250.4 / .14), inset 0 1px 0 #fff; --sb-accent:var(--brand-700);
}

/* chỉ báo đồng bộ: luôn ở cuối bên phải thanh trên, khung bề rộng cố định — đổi chữ không làm xê dịch gì */
.ob-pill{ order:99; display:inline-flex; align-items:center; justify-content:flex-start; gap:7px; width:124px; height:30px; padding:0 12px; flex-shrink:0; border-radius:999px; border:1px solid var(--border); background:var(--surface);
  font-size:11.5px; font-weight:700; color:var(--ink-2); cursor:pointer; white-space:nowrap; overflow:hidden; transition:background var(--t-fast), color var(--t-fast), border-color var(--t-fast) }
.ob-pill span{ overflow:hidden; text-overflow:ellipsis }
.ob-pill:hover{ background:var(--surface-3) }
.ob-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; background:#22C55E; box-shadow:0 0 0 3px rgba(34,197,94,.16) }
.ob-pill.ok{ color:var(--muted) }
.ob-pill.sync{ color:#C2410C; border-color:#FED7AA; background:#FFF7ED } .ob-pill.sync .ob-dot{ background:#F97316; animation:obPulse 1s ease-in-out infinite }
.ob-pill.warn{ color:#A16207; border-color:#FDE68A; background:#FEFCE8 } .ob-pill.warn .ob-dot{ background:#EAB308; box-shadow:0 0 0 3px rgba(234,179,8,.2) }
.ob-pill.bad{ color:#B91C1C; border-color:#FECACA; background:#FEF2F2 } .ob-pill.bad .ob-dot{ background:#EF4444; box-shadow:0 0 0 3px rgba(239,68,68,.2) }
@media (max-width:820px){ .ob-pill{ width:32px; height:32px; padding:0; justify-content:center } .ob-pill span{ display:none } }
@keyframes obPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(249,115,22,.55) } 50%{ box-shadow:0 0 0 4px rgba(249,115,22,0) } }
.ob-r{ display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid var(--border) } .ob-r > div{ flex:1; min-width:0; display:flex; flex-direction:column } .ob-r small{ color:var(--muted); font-size:11.5px; overflow-wrap:anywhere }
