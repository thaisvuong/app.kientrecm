<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiến Trẻ</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #FFFFFF; overflow: hidden; }
  #f { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<!-- LINK TẠM (kientre-internal.click/s/<mã>): trang xem do Apps Script dựng, mở trong khung toàn màn hình; thanh địa chỉ giữ dạng /s/<mã> -->
<iframe id="f" title="Tài liệu" allow="clipboard-read; clipboard-write; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
  (function () {
    var EXEC = 'https://script.google.com/macros/s/AKfycbxKXWv9Jg4KnV2ydW9tXWEsZsJIy1Ai07aHrY-cqF1i0t-RYl7xEcjsv2HuNtLC_7c/exec';
    var q = new URLSearchParams(location.search), t = (q.get('t') || '').replace(/[^\w-]/g, '');
    if (!t) { location.replace('/'); return; }
    var p = new URLSearchParams(); p.set('s', t); if (q.get('o')) p.set('o', q.get('o'));
    document.getElementById('f').src = EXEC + '?' + p.toString();
    try { history.replaceState(null, '', '/s/' + t + (q.get('o') ? '?o=' + encodeURIComponent(q.get('o')) : '')); } catch (e) {}
  })();
</script>
</body>
</html>
