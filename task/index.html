<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiến Task</title>
<!-- Kiến Task chạy chung Kiến Chuyên môn (từ 17-10-2026): /task/… chuyển về trang chính, mở thẳng tab Kiến Task -->
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var p = q.get('page') || 'tasks';
    if (!/^tasks(\/|$)/.test(p)) p = 'tasks/' + p.replace(/^\/+/, '');
    q.set('page', p);
    location.replace('../?' + q.toString());
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../?page=tasks"></noscript>
</head>
<body></body>
</html>
